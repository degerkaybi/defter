<style>
/* Layout: one calm notebook page made of soft cards on ruled paper; a floating tab bar sits at the bottom. */
:root{
  --paper:#f2ede2;
  --desk:#e8e2d5;
  --sheet:#f8f4ea;
  --ink:#33373f;
  --ink-soft:#6b6f78;
  --ink-faint:#a9a8a1;
  --blue:#4a6d9f;--nt:var(--blue);
  --sun:#e08a4f;
  --today:#c9692a;--pj:#c9692a;--pj-soft:rgba(201,105,42,.34);--pj-wash:rgba(201,105,42,.12);--pin:#f7e792;--pin-ink:#4a431f;--pin-scroll:rgba(55,48,22,.55);
  --blue-soft:rgba(74,109,159,.28);
  --blue-wash:rgba(74,109,159,.11);
  --card:rgba(74,109,159,.055);
  --float:rgba(140,112,64,.075);
  --danger:#b4534a;
  --card-dim:rgba(60,76,110,.085);
  --chip:rgba(60,70,90,.07);
  --rule:rgba(60,72,100,.12);
  --rule-strong:rgba(60,72,100,.19);
  --scrim:rgba(36,34,30,.30);
  --shadow:0 12px 36px rgba(40,36,28,.16);
  --lift:0 1px 3px rgba(40,36,28,.14);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .035 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --hand:'Caveat','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs:1;--zm:1;--hs:calc(var(--fs)*var(--zm));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode]){
    --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
    --sun:#f0a468;--today:#f0a468;--pj:#f0a468;--pj-soft:rgba(240,164,104,.36);--pj-wash:rgba(240,164,104,.15);--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
    --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
    --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
    --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
    --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode]),:root[data-mode="dark"]{
  --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
  --sun:#f0a468;--today:#f0a468;--pj:#f0a468;--pj-soft:rgba(240,164,104,.36);--pj-wash:rgba(240,164,104,.15);--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
  --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
  --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
  --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  color-scheme:dark;
}
:root[data-font="plain"]{--hand:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fs:.66}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background-color:var(--paper);
  background-image:var(--grain);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 124px;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;transition:background-color .15s,color .15s,opacity .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}
h1{margin:0;font-weight:inherit}
.app{max-width:560px;margin:0 auto}

/* top bar */
.gear{pointer-events:auto;position:relative;flex:none;width:36px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:none;border:0;box-shadow:none}

.gear[hidden]{display:none}
.syncbtn.busy svg{animation:spin 1s linear infinite}
@keyframes spin{to{transform:rotate(360deg)}}
.syncbtn.pend::after{content:'';position:absolute;top:8px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--blue)}

.pinbtn svg .pn{fill:var(--pin);stroke:var(--ink-soft)}
.pinwrap{width:min(100%,380px);max-height:min(88vh,calc(var(--vvh,100vh) - 20px));display:flex;flex-direction:column;gap:10px;animation:rise .22s ease}
.pinbar{display:flex;align-items:center;gap:8px}
.pinpill{background:var(--sheet);color:var(--ink);border-radius:999px;padding:10px 15px;font:600 13px/1 var(--sans);box-shadow:var(--lift)}
.pinbar .sp{flex:1}
.pinlist{flex:1 1 auto;min-height:0;overflow-y:auto;display:flex;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:18px 14px;padding:8px 6px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--pin-scroll) transparent}
.pinlist::-webkit-scrollbar{width:8px}
.pinlist::-webkit-scrollbar-track{background:transparent}
.pinlist::-webkit-scrollbar-thumb{background:var(--pin-scroll);border-radius:8px}
.pin{position:relative;flex:0 0 100%;min-width:0;background:var(--pin);color:var(--pin-ink);border-radius:2px;padding:24px 18px 8px;box-shadow:0 14px 20px -10px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.12);transform:rotate(-.8deg)}
.pin:nth-child(even){transform:rotate(.7deg)}
.pin.half{flex:0 0 calc(50% - 7px);padding:22px 12px 6px;aspect-ratio:1/1;align-self:flex-start;display:flex;flex-direction:column}
.pin.half textarea{flex:1 1 auto;min-height:0;height:auto;overflow-y:auto}
.pin::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(0,0,0,.09),rgba(0,0,0,0))}
.phandle{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;touch-action:none;background:linear-gradient(315deg,var(--sheet) 50%,rgba(0,0,0,.18) 50%);box-shadow:-2px -2px 4px rgba(0,0,0,.08)}
.pin textarea{display:block;width:100%;min-height:48px;background:none;border:0;outline:0;resize:none;overflow:hidden;padding:0;font:400 calc(24px*var(--hs))/1.28 var(--hand);color:var(--pin-ink)}
.pin.half textarea{font-size:calc(20px*var(--hs))}
.pin textarea::placeholder{color:var(--pin-ink);opacity:.45}
.pin .pact{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-right:26px}
.pin .pact button{font:600 12px/1 var(--sans);color:var(--pin-ink);opacity:.62;padding:10px 6px}
.pin .pact button:hover,.pin .pact button.on{opacity:1}
.pin.half .pact{padding-right:22px}.pin.half .pact button{font-size:11px;padding:10px 3px}
.pin.half .bt-l{display:none}
.pmove{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px;padding:8px;border-radius:8px;background:rgba(0,0,0,.07)}
.pmove .ml{font:600 12px/1 var(--sans)}
.pmove input[type=date]{flex:1 1 90px;min-width:0;font:14px var(--sans);color:var(--pin-ink);background:rgba(255,255,255,.45);border:0;border-radius:7px;padding:7px 8px}
.pmove .mc{flex:1 1 auto;padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.45);font:600 12px/1 var(--sans);color:var(--pin-ink);text-align:center}

/* period navigation */
.nav{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:start;gap:0;margin:0 0 20px}
.ncenter{display:flex;align-items:flex-start;justify-content:center;min-width:0}
.ncenter .t{flex:1 1 auto;max-width:calc(300px*var(--hs))}
.nslot{width:36px;height:40px;margin-top:calc((36px*var(--hs) - 40px)/2)}
.arrow{flex:none;width:30px;height:40px;margin-top:calc((36px*var(--hs) - 40px)/2);border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:none}
.nav .t{text-align:center;min-width:0}
.title{font:400 calc(30px*var(--hs))/calc(36px*var(--hs)) var(--hand);color:var(--ink);white-space:nowrap}
.title.istoday{color:var(--today)}
.sub{font:400 calc(22px*var(--hs))/1.2 var(--hand);color:var(--blue)}
.backwrap{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:flex-end;max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.back{pointer-events:auto;padding:10px 16px;border-radius:999px;background:var(--sheet);border:1px solid var(--blue-soft);color:var(--blue);box-shadow:var(--shadow);font:500 13px/1 var(--sans)}
.datepick{position:relative;display:inline-block;max-width:100%}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0}

/* small labels and floating notes */
.label{font:600 12px/1 var(--sans);letter-spacing:.02em;color:var(--blue);margin:2px 0 6px}
.float,.quiet{margin:0 0 18px;padding:0;background:none;border:0}
.float>.label,.quiet>.label{margin:2px 0 4px;padding:0 0 7px;border-bottom:1px solid var(--rule)}
.quiet+.quiet{margin-top:-4px}
.quiet .lines{background-image:none;min-height:0}
.qadd{display:block;width:100%;text-align:left;color:var(--ink-faint);font:400 calc(21px*var(--hs))/30px var(--hand);padding:0 0 0 26px}
.qempty{margin-bottom:12px}
.qempty .qadd{padding:9px 2px;font:500 13px/1.2 var(--sans);color:var(--ink-soft);border-bottom:1px dashed var(--rule-strong)}
.quiet.dz-over,.qempty.dz-over{background:var(--chip);border-radius:10px}
.float{margin-bottom:18px}
.float .lines{background-image:none;min-height:0}
.qrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto auto auto 28px;align-items:start;min-height:30px}
.qrow .cb{height:30px}
.qrow .cb svg{width:16px;height:16px}
.qtext{font:400 calc(21px*var(--hs))/30px var(--hand);color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.done .qtext{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-faint)}
.qrow.done .notebtn{display:none}
.qrow .nudge{line-height:30px;font-size:calc(18px*var(--hs))}
.carry{margin:-6px 0 14px;padding:12px 14px 6px;border:1px dashed var(--rule-strong);border-radius:18px}
.carry .label{color:var(--ink-soft)}
.crow{display:flex;gap:12px;align-items:baseline;justify-content:space-between;min-height:30px}
.crow .tx{font:400 calc(21px*var(--hs))/30px var(--hand);color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow button{font:500 13px/30px var(--sans);color:var(--blue);white-space:nowrap}

/* ruled lines */
.lines{
  position:relative;
  min-height:calc(var(--row)*var(--min,2));
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row) - 1px),var(--rule) calc(var(--row) - 1px),var(--rule) var(--row));
}
.lines.margin{background-clip:padding-box;background-color:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:0 10px 0 4px;overflow:hidden}
.lines.margin::before{content:"";position:absolute;left:37px;top:0;bottom:0;width:1px;background:var(--blue-soft);pointer-events:none}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto auto auto auto;align-items:start;min-height:var(--row)}
.cb{height:var(--row);display:grid;place-items:center;color:var(--ink-faint)}
.cb svg{width:18px;height:18px;overflow:visible}
.cb rect{transition:fill .2s,stroke .2s}
.cb .tick{stroke:var(--blue);stroke-width:1.9;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .25s ease}
.done .cb rect{fill:var(--blue-wash);stroke:var(--blue)}
.done .cb .tick{stroke-dashoffset:0}
.draft .cb{visibility:hidden}
.tw{position:relative;min-width:0}
.row textarea{
  display:block;width:100%;min-width:0;height:var(--row);
  border:0;outline:0;background:transparent;resize:none;overflow:hidden;white-space:pre;
  padding:0 0 0 6px;margin:0;border-radius:0;-webkit-appearance:none;appearance:none;
  font-family:var(--hand);font-size:calc(var(--row)*.76*var(--hs));line-height:var(--row);
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--blue);
}
.lines.margin .row.open{background:var(--sheet);box-shadow:inset 0 -1px 0 var(--rule);margin:0 -10px 0 -4px;padding:0 10px 0 4px}
.row:not(.open) textarea{height:var(--row)!important}
.row.open textarea{color:var(--ink);-webkit-text-fill-color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.row textarea::placeholder{color:var(--ink-soft);-webkit-text-fill-color:var(--ink-soft);opacity:.6}
.view{position:absolute;left:0;right:0;top:0;height:var(--row);padding:0 0 0 6px;font-family:var(--hand);font-size:calc(var(--row)*.76*var(--hs));line-height:var(--row);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.row.open .view{display:none}
.done .view{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.done.open textarea{color:var(--ink-soft);-webkit-text-fill-color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1.5px}
.pjbtn{height:var(--row,30px);width:26px;display:grid;place-items:center;color:var(--blue)}
.pjbtn svg{width:17px;height:17px}
.pjbtn[hidden]{display:none!important}
.pjsec{margin:18px 0 0}
.pjsec .label{margin:2px 0 8px;padding:0 0 7px;border-bottom:1px solid var(--rule);display:block;width:100%;text-align:left}
.pjchips{display:flex;flex-wrap:wrap;gap:8px}
.pjc{display:inline-flex;align-items:baseline;gap:8px;max-width:100%;padding:8px 13px;border-radius:14px;background:var(--card-dim);box-shadow:inset 0 0 0 1px var(--rule);color:var(--ink)}
.pjc .pt{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font:400 calc(20px*var(--hs))/1.15 var(--hand)}
.pjc .pm{flex:none;font:500 11px/1 var(--sans);color:var(--ink-soft)}
.pjc.add{align-items:center;background:none;box-shadow:inset 0 0 0 1px var(--blue-soft);color:var(--blue);font:600 12.5px/1 var(--sans);padding:10px 13px}
.pjhead{display:flex;align-items:center;gap:8px;flex:1;min-width:0}
.pjhead .pjh{flex:1;min-width:0;font:400 calc(26px*var(--hs))/1.15 var(--hand);color:var(--ink)}
.pjhead input.pjh{width:100%;border:0;outline:0;background:none;padding:2px 0;border-radius:0}
.pjhead input.pjh::placeholder{color:var(--ink-faint)}
.pjback{flex:none;width:32px;height:36px;display:grid;place-items:center;color:var(--ink-soft)}
.pjnew{flex:none;padding:9px 13px;border-radius:12px;background:var(--blue-wash);color:var(--blue);font:600 13px/1 var(--sans)}
.pjlist{display:flex;flex-direction:column;gap:8px;padding:4px 0 8px}
.pjcard{display:block;width:100%;text-align:left;padding:14px 14px 12px;border-radius:16px;background:var(--chip)}
.pjcard .pt{display:block;font:400 calc(23px*var(--hs))/1.2 var(--hand);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.pjcard .pm{display:flex;align-items:center;gap:10px;margin-top:8px;font:500 12px/1 var(--sans);color:var(--ink-soft)}
.pjcard .bar{flex:1;height:4px;border-radius:4px;background:var(--rule);overflow:hidden}
.pjcard .bar i{display:block;height:100%;background:var(--blue);border-radius:4px}
.pjempty{margin:18px 6px;font:14px/1.5 var(--sans);color:var(--ink-soft)}
.pjprog{margin:0 4px 6px;font:500 12px/1 var(--sans);color:var(--ink-soft)}
.ptd{transition:transform .14s ease}
.ptd.dragging{transition:none;position:relative;z-index:3;background:var(--blue-wash);border-radius:10px;box-shadow:0 4px 14px rgba(40,36,28,.14)}
.ptd .cb{-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.ptd{display:grid;grid-template-columns:30px minmax(0,1fr) auto 28px;align-items:start;border-bottom:1px solid var(--rule);--row:36px}
.ptd .cb{height:36px}
.ptd textarea{display:block;width:100%;min-height:36px;border:0;outline:0;background:none;resize:none;overflow:hidden;padding:max(2px,calc((36px - 23px*var(--hs)*1.25)/2)) 0 max(2px,calc((36px - 23px*var(--hs)*1.25)/2)) 6px;margin:0;border-radius:0;font:400 calc(23px*var(--hs))/1.25 var(--hand);color:var(--ink)}
.ptd textarea::placeholder{color:var(--ink-faint)}
.ptd.done textarea{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.pdt{position:relative;display:inline-flex;align-items:center;gap:4px;height:36px;padding:0 4px}
.pdt .pdl{display:inline-flex;align-items:center;gap:4px;padding:5px 9px;border-radius:999px;font:500 12px/1 var(--sans);color:var(--ink-faint);white-space:nowrap}
.pdt.has .pdl{background:var(--blue-wash);color:var(--blue)}
.pdt.od .pdl{background:none;color:var(--danger);box-shadow:inset 0 0 0 1px var(--danger)}
.pdt svg{width:14px;height:14px}
.pdt input{position:absolute;inset:0;width:100%;height:100%;opacity:0;font-size:16px;border:0;padding:0}
.pdp{position:relative;display:inline-grid;place-items:center;width:24px;height:24px;margin:-4px 0 -4px -6px}
.pdp input{border-radius:0}
.pdgo{font:inherit;color:inherit;padding:2px 2px 2px 0;cursor:pointer}
.pdt .pdx{position:relative;z-index:1;margin-left:-2px;width:20px;height:20px;border-radius:10px;color:var(--ink-soft);font:15px/1 var(--sans);display:grid;place-items:center}
.pdel{height:36px;color:var(--ink-faint);font:18px/1 var(--sans);display:grid;place-items:center}
.pjadd{display:block;margin:8px 4px 4px;padding:10px 6px;color:var(--blue);font:600 13px/1 var(--sans)}

function noteBullets(ta,onChange){
  function lineRange(a,b){
    var v=ta.value,ls=v.lastIndexOf('\n',a-1)+1,le=v.indexOf('\n',b);if(le<0)le=v.length;
    return [ls,le];
  }
  ta.addEventListener('input',function(){
    var v=ta.value,c=ta.selectionStart,r=lineRange(c,c),ln=v.slice(r[0],r[1]);
    if(/^[-*] /.test(ln)&&c>=r[0]+2&&c<=r[0]+2+Math.max(0,ln.length-2)){
      ta.value=v.slice(0,r[0])+'• '+v.slice(r[0]+2);ta.setSelectionRange(c,c);
    }else{
      var bm=/^\[[ xX]?\] /.exec(ln);
      if(bm&&c>=r[0]+bm[0].length){
        var ck=/[xX]/.test(bm[0])?'☑ ':'☐ ';
        ta.value=v.slice(0,r[0])+ck+v.slice(r[0]+bm[0].length);var nc=c-bm[0].length+2;ta.setSelectionRange(nc,nc);
      }
    }
    onChange();
  });
  ta.addEventListener('beforeinput',function(e){
    if(e.inputType!=='insertLineBreak'&&e.inputType!=='insertParagraph')return;
    var a=ta.selectionStart,b=ta.selectionEnd;if(a!==b)return;
    var r=lineRange(a,a),ln=ta.value.slice(r[0],r[1]);
    var pre=ln.indexOf('• ')===0?'• ':(/^[☐☑] /.test(ln)?'☐ ':'');
    if(!pre)return;
    e.preventDefault();
    if(ln.length===2){ta.setRangeText('',r[0],r[1],'end')}
    else ta.setRangeText('\n'+pre,a,a,'end');
    onChange();
  });
  ta.addEventListener('click',function(){
    if(ta.selectionStart!==ta.selectionEnd)return;
    var c=ta.selectionStart,r=lineRange(c,c),ln=ta.value.slice(r[0],r[1]);
    if(c-r[0]>1||!/^[☐☑] /.test(ln))return;
    ta.setRangeText(ln.charAt(0)==='☐'?'☑':'☐',r[0],r[0]+1,'preserve');
    onChange();
  });
  function checks(){
    var a=ta.selectionStart,b=ta.selectionEnd,r=lineRange(a,b),v=ta.value;
    var lines=v.slice(r[0],r[1]).split('\n');
    var all=lines.every(function(l){return /^[☐☑] /.test(l)});
    var out=lines.map(function(l){

var SCOPE='https://www.googleapis.com/auth/drive.appdata',FNAME='yarin-defteri.json';

function loadGIS(){
  return new Promise(function(res,rej){
    if(window.google&&google.accounts&&google.accounts.oauth2)return res();
    var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
    sc.onload=function(){res()};sc.onerror=function(){rej(new Error('gis'))};

function getToken(interactive,silentOk){
  if(gTok&&Date.now()<gTokExp-60000)return Promise.resolve(gTok);
  if(!interactive&&!silentOk)return Promise.reject(new Error('needlogin'));
  function tidy(){
    /* Google leaves a hidden frame behind after a silent sign-in; a stuck one keeps the browser tab spinning */
    if(interactive)return;
    var fr=document.querySelectorAll('iframe[src*="accounts.google.com"]');
    for(var i=0;i<fr.length;i++)if(fr[i].parentNode)fr[i].parentNode.removeChild(fr[i]);
  }
  return loadGIS().then(function(){return new Promise(function(res,rej){
    var to=setTimeout(function(){rej(new Error('timeout'))},interactive?120000:15000);
    var c=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:SCOPE,
      callback:function(r){clearTimeout(to);
        if(r&&r.access_token){gTok=r.access_token;gTokExp=Date.now()+(r.expires_in||3600)*1000;saveTok();res(gTok)}
        else rej(new Error((r&&r.error)||'auth'))},
      error_callback:function(e){clearTimeout(to);rej(new Error((e&&e.type)||'popup'))}});
    c.requestAccessToken(interactive?{}:{prompt:'none'});
  })}).then(function(t){tidy();return t},function(e){tidy();if(!interactive)silentFail=Date.now();throw e});
}
function dFetch(url,opt){
  opt=opt||{};opt.headers=Object.assign({Authorization:'Bearer '+gTok},opt.headers||{});
  return fetch(url,opt).then(function(r){
    if(r.status===401){gTok=null;saveTok();throw new Error('401')}
    if(!r.ok)throw new Error('http '+r.status);
    return r;
  });
}

function attachDrag(btn,row){

  btn.addEventListener('pointerdown',function(e){

    try{btn.setPointerCapture(e.pointerId)}catch(err){}

function updateDrag(){

  var old=document.querySelectorAll('.dz-over,.dchip.over');
  for(var i=0;i<old.length;i++){old[i].classList.remove('dz-over');old[i].classList.remove('over')}
  drag.target=null;drag.overChip=false;dropline.hidden=true;

  zone.classList.add(isChip?'over':'dz-over');
  var rows=[].slice.call(zone.querySelectorAll('.row:not(.draft):not(.dragging),.qrow:not(.dragging)'));
  var before=null;
  for(var j=0;j<rows.length;j++){var r=rows[j].getBoundingClientRect();if(y<r.top+r.height/2){before=rows[j];break}}
  drag.target={layer:zone.dataset.layer,key:zone.dataset.key,beforeId:before?before.dataset.id:null};
  if(!isChip&&rows.length){

    dropline.style.left=(zr.left+12)+'px';dropline.style.width=Math.max(0,zr.width-24)+'px';

var pageEl=document.getElementById('page'),sx=null,sy=0,st=0;
pageEl.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
},{passive:true});
pageEl.addEventListener('touchend',function(e){
  if(sx==null||drag||Date.now()-lastDragEnd<500){sx=null;return}
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;sx=null;
  if(Math.abs(dx)>90&&Math.abs(dy)<40&&dt<450)shift(dx<0?1:-1);
},{passive:true});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var nowKey=dkey(today());
  if(nowKey!==lastToday){if(dkey(anchor)===lastToday)anchor=today();lastToday=nowKey;render()}
  if(SYNC_OK&&S.syncOn&&Date.now()-lastAuto>30000)syncNow(true,true);
});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitAll();fitTitle()});
window.addEventListener('resize',function(){fitAll();fitTitle()});

document.getElementById('gear').setAttribute('aria-label',T.settings);
document.getElementById('pinBtn').setAttribute('aria-label',T.pins);
buildTabs();render();
syncBtnUpdate();
document.getElementById('syncBtn').addEventListener('click',function(){syncNow(false)});
if(SYNC_OK&&S.syncOn)setTimeout(function(){syncNow(true,true)},600);
})();

/* klavye açılınca pencereler görünür alanın içinde kalsın */
(function(){
  var vv=window.visualViewport,root=document.documentElement;
  if(!vv)return;
  function upd(){
    if(Math.abs(vv.scale-1)>.02){root.style.removeProperty('--vvh');root.style.removeProperty('--vvt');return}
    root.style.setProperty('--vvh',Math.round(vv.height)+'px');
    root.style.setProperty('--vvt',Math.round(vv.offsetTop)+'px');
    var a=document.activeElement;
    if(a&&sheet&&sheet.contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName))a.scrollIntoView({block:'nearest'});
  }
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);
  sheet.addEventListener('focusin',function(e){
    var t=e.target;if(!/^(TEXTAREA|INPUT)$/.test(t.tagName))return;
    setTimeout(function(){upd();t.scrollIntoView({block:'nearest'})},120);
    setTimeout(function(){t.scrollIntoView({block:'nearest'})},400);
  });
  upd();
})();
</script>

<script>
if('serviceWorker' in navigator && /^https?:$/.test(location.protocol)){
  window.addEventListener('load',function(){navigator.serviceWorker.register('sw.js').catch(function(){})});
}
</script>
