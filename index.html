<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#faf7f1" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yarın Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Yarın Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Jost:wght@400&display=swap">
<style>
/* Layout: one calm notebook page made of soft cards on ruled paper; a floating tab bar sits at the bottom. */
:root{
  --paper:#faf7f1;
  --desk:#efeae0;
  --sheet:#fffdf9;
  --ink:#33373f;
  --ink-soft:#6b6f78;
  --ink-faint:#a9a8a1;
  --blue:#4a6d9f;
  --sun:#e08a4f;
  --today:#c9692a;--pin:#f7e792;--pin-ink:#4a431f;--pin-scroll:rgba(55,48,22,.55);
  --blue-soft:rgba(74,109,159,.28);
  --blue-wash:rgba(74,109,159,.11);
  --card:rgba(74,109,159,.055);
  --float:rgba(140,112,64,.075);
  --danger:#b4534a;
  --card-dim:rgba(60,76,110,.085);
  --chip:rgba(60,70,90,.07);
  --rule:rgba(60,72,100,.10);
  --rule-strong:rgba(60,72,100,.17);
  --scrim:rgba(36,34,30,.30);
  --shadow:0 12px 36px rgba(40,36,28,.16);
  --lift:0 1px 3px rgba(40,36,28,.14);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .035 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --hand:'Caveat','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs:1;--zm:1;--hs:calc(var(--fs)*var(--zm));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
    --sun:#f0a468;--today:#f0a468;--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
    --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
    --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
    --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
    --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
  --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
  --sun:#f0a468;--today:#f0a468;--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
  --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
  --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
  --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  color-scheme:dark;
}
:root[data-font="plain"]{--hand:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fs:.66}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background-color:var(--paper);
  background-image:var(--grain);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 124px;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;transition:background-color .15s,color .15s,opacity .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}
h1{margin:0;font-weight:inherit}
.app{max-width:560px;margin:0 auto}

/* top bar */
.gear{position:relative;flex:none;width:36px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:none;border:0;box-shadow:none}

.gear[hidden]{display:none}
.syncbtn.busy svg{animation:spin 1s linear infinite}
.syncbtn.pend::after{content:'';position:absolute;top:8px;right:6px;width:7px;height:7px;border-radius:50%;background:var(--blue)}
@keyframes spin{to{transform:rotate(360deg)}}

.pinbtn svg .pn{fill:var(--pin);stroke:var(--ink-soft)}
.pinwrap{width:min(100%,380px);max-height:88vh;display:flex;flex-direction:column;gap:10px;animation:rise .22s ease}
.pinbar{display:flex;align-items:center;gap:8px}
.pinpill{background:var(--sheet);color:var(--ink);border-radius:999px;padding:10px 15px;font:600 13px/1 var(--sans);box-shadow:var(--lift)}
.pinbar .sp{flex:1}
.pinlist{overflow-y:auto;display:flex;flex-direction:row;flex-wrap:wrap;align-content:flex-start;gap:18px 14px;padding:8px 6px 18px;-webkit-overflow-scrolling:touch;overscroll-behavior:contain;scrollbar-width:thin;scrollbar-color:var(--pin-scroll) transparent}
.pinlist::-webkit-scrollbar{width:8px}
.pinlist::-webkit-scrollbar-track{background:transparent}
.pinlist::-webkit-scrollbar-thumb{background:var(--pin-scroll);border-radius:8px}
.pin{position:relative;flex:0 0 100%;min-width:0;background:var(--pin);color:var(--pin-ink);border-radius:2px;padding:24px 18px 8px;box-shadow:0 14px 20px -10px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.12);transform:rotate(-.8deg)}
.pin:nth-child(even){transform:rotate(.7deg)}
.pin.half{flex:0 0 calc(50% - 7px);padding:22px 12px 6px}
.pin::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(0,0,0,.09),rgba(0,0,0,0))}
.phandle{position:absolute;right:0;bottom:0;width:30px;height:30px;cursor:nwse-resize;touch-action:none;background:linear-gradient(315deg,var(--sheet) 50%,rgba(0,0,0,.18) 50%);box-shadow:-2px -2px 4px rgba(0,0,0,.08)}
.pin textarea{display:block;width:100%;min-height:48px;background:none;border:0;outline:0;resize:none;overflow:hidden;padding:0;font:400 calc(24px*var(--hs))/1.28 var(--hand);color:var(--pin-ink)}
.pin.half textarea{font-size:calc(20px*var(--hs))}
.pin textarea::placeholder{color:var(--pin-ink);opacity:.45}
.pin .pact{display:flex;justify-content:space-between;align-items:center;margin-top:4px;padding-right:26px}
.pin .pact button{font:600 12px/1 var(--sans);color:var(--pin-ink);opacity:.62;padding:10px 6px}
.pin .pact button:hover,.pin .pact button.on{opacity:1}
.pin.half .pact{padding-right:22px}.pin.half .pact button{font-size:11px;padding:10px 3px}
.pin.half .bt-l{display:none}
.pmove{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px;padding:8px;border-radius:8px;background:rgba(0,0,0,.07)}
.pmove .ml{font:600 12px/1 var(--sans)}
.pmove input[type=date]{flex:1 1 90px;min-width:0;font:14px var(--sans);color:var(--pin-ink);background:rgba(255,255,255,.45);border:0;border-radius:7px;padding:7px 8px}
.pmove .mc{flex:1 1 auto;padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.45);font:600 12px/1 var(--sans);color:var(--pin-ink);text-align:center}

/* period navigation */
.nav{display:grid;grid-template-columns:36px minmax(0,1fr) 36px;align-items:start;gap:0;margin:0 0 20px}
.ncenter{display:flex;align-items:flex-start;justify-content:center;min-width:0}
.ncenter .t{flex:1 1 auto;max-width:calc(300px*var(--hs))}
.nslot{width:36px;height:40px;margin-top:calc((36px*var(--hs) - 40px)/2)}
.arrow{flex:none;width:30px;height:40px;margin-top:calc((36px*var(--hs) - 40px)/2);border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:none}
.nav .t{text-align:center;min-width:0}
.title{font:400 calc(30px*var(--hs))/calc(36px*var(--hs)) var(--hand);color:var(--ink);white-space:nowrap}
.title.istoday{color:var(--today)}
.sub{font:400 calc(22px*var(--hs))/1.2 var(--hand);color:var(--blue)}
.backwrap{position:fixed;left:0;right:0;bottom:calc(76px + env(safe-area-inset-bottom,0px));z-index:19;display:flex;justify-content:flex-end;max-width:560px;margin:0 auto;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 max(16px,env(safe-area-inset-left,0px));pointer-events:none}
.back{pointer-events:auto;padding:10px 16px;border-radius:999px;background:var(--sheet);border:1px solid var(--blue-soft);color:var(--blue);box-shadow:var(--shadow);font:500 13px/1 var(--sans)}
.datepick{position:relative;display:inline-block;max-width:100%}
.datepick input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer;font-size:16px;border:0;padding:0}

/* small labels and floating notes */
.label{font:600 12px/1 var(--sans);letter-spacing:.02em;color:var(--blue);margin:2px 0 6px}
.float,.quiet{margin:0 0 18px;padding:0;background:none;border:0}
.float>.label,.quiet>.label{margin:2px 0 4px;padding:0 0 7px;border-bottom:1px solid var(--rule)}
.quiet+.quiet{margin-top:-4px}
.quiet .lines{background-image:none;min-height:0}
.qadd{display:block;width:100%;text-align:left;color:var(--ink-faint);font:400 calc(21px*var(--hs))/30px var(--hand);padding:0 0 0 26px}
.qempty{margin-bottom:12px}
.qempty .qadd{padding:9px 2px;font:500 13px/1.2 var(--sans);color:var(--ink-soft);border-bottom:1px dashed var(--rule-strong)}
.quiet.dz-over,.qempty.dz-over{background:var(--chip);border-radius:10px}
.float{margin-bottom:18px}
.float .lines{background-image:none;min-height:0}
.qrow{display:grid;grid-template-columns:26px minmax(0,1fr) auto 28px;align-items:start;min-height:30px}
.qrow .cb{height:30px}
.qrow .cb svg{width:16px;height:16px}
.qtext{font:400 calc(21px*var(--hs))/30px var(--hand);color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.qrow.done .qtext{text-decoration:line-through;text-decoration-thickness:1.5px;color:var(--ink-faint)}
.qrow.done .notebtn{display:none}
.qrow .nudge{line-height:30px;font-size:calc(18px*var(--hs))}
.carry{margin:-6px 0 14px;padding:12px 14px 6px;border:1px dashed var(--rule-strong);border-radius:18px}
.carry .label{color:var(--ink-soft)}
.crow{display:flex;gap:12px;align-items:baseline;justify-content:space-between;min-height:30px}
.crow .tx{font:400 calc(21px*var(--hs))/30px var(--hand);color:var(--ink-soft);min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.crow button{font:500 13px/30px var(--sans);color:var(--blue);white-space:nowrap}

/* ruled lines */
.lines{
  position:relative;
  min-height:calc(var(--row)*var(--min,2));
  background-image:repeating-linear-gradient(to bottom,transparent 0,transparent calc(var(--row) - 1px),var(--rule) calc(var(--row) - 1px),var(--rule) var(--row));
}
.lines.margin{background-color:var(--sheet);border:1px solid var(--rule);border-radius:20px;padding:0 10px 0 4px;overflow:hidden}
.lines.margin::before{content:"";position:absolute;left:37px;top:0;bottom:0;width:1px;background:var(--blue-soft);pointer-events:none}
.row{display:grid;grid-template-columns:30px minmax(0,1fr) auto auto auto;align-items:start;min-height:var(--row)}
.cb{height:var(--row);display:grid;place-items:center;color:var(--ink-faint)}
.cb svg{width:18px;height:18px;overflow:visible}
.cb rect{transition:fill .2s,stroke .2s}
.cb .tick{stroke:var(--blue);stroke-width:1.9;stroke-dasharray:14;stroke-dashoffset:14;transition:stroke-dashoffset .25s ease}
.done .cb rect{fill:var(--blue-wash);stroke:var(--blue)}
.done .cb .tick{stroke-dashoffset:0}
.draft .cb{visibility:hidden}
.tw{position:relative;min-width:0}
.row textarea{
  display:block;width:100%;min-width:0;height:var(--row);
  border:0;outline:0;background:transparent;resize:none;overflow:hidden;white-space:pre;
  padding:0 0 0 6px;margin:0;border-radius:0;-webkit-appearance:none;appearance:none;
  font-family:var(--hand);font-size:calc(var(--row)*.76*var(--hs));line-height:var(--row);
  color:transparent;-webkit-text-fill-color:transparent;caret-color:var(--blue);
}
.row:not(.open) textarea{height:var(--row)!important}
.row.open textarea{color:var(--ink);-webkit-text-fill-color:var(--ink);white-space:pre-wrap;overflow-wrap:anywhere}
.row textarea::placeholder{color:var(--ink-soft);-webkit-text-fill-color:var(--ink-soft);opacity:.6}
.view{position:absolute;left:0;right:0;top:0;height:var(--row);padding:0 0 0 6px;font-family:var(--hand);font-size:calc(var(--row)*.76*var(--hs));line-height:var(--row);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.row.open .view{display:none}
.done .view{color:var(--ink-faint);text-decoration:line-through;text-decoration-thickness:1.5px}
.done.open textarea{color:var(--ink-soft);-webkit-text-fill-color:var(--ink-soft);text-decoration:line-through;text-decoration-thickness:1.5px}
.more,.notebtn{height:var(--row,30px);display:grid;place-items:center;color:var(--ink-faint);opacity:.65}
.more svg{width:18px;height:18px}
.notebtn svg{width:16px;height:16px}
.notebtn.has{color:var(--blue);opacity:1}
.notebtn.has path:first-child{fill:var(--blue-soft)}
.row .acts{display:contents}
.row .more,.row .notebtn{display:none}
.row .notebtn.has{display:grid;width:26px}
.row:not(.draft) .more{display:grid;width:34px;opacity:.85}
.nudge{font:400 calc(19px*var(--hs))/var(--row) var(--hand);color:var(--blue);opacity:.85;white-space:nowrap;padding:0 4px 0 8px}
.done .nudge,.draft .nudge{display:none}
.pull{display:inline-block;margin:16px 0 0;padding:9px 15px;border-radius:999px;background:var(--blue-wash);color:var(--blue);font:500 13.5px/1 var(--sans)}

/* week page */
.wday{display:grid;grid-template-columns:40px minmax(0,1fr);column-gap:6px;align-items:start;margin:0 0 8px;padding:5px 12px 5px 12px;background:var(--card-dim);border-radius:18px}
.wday{position:relative}
.wday::before{content:"";position:absolute;left:55px;top:9px;bottom:9px;width:1px;background:var(--rule-strong);pointer-events:none}
.wday .lines{background-image:none;min-height:0}
.wlab{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;min-height:32px;padding-top:1px;font-family:var(--hand);line-height:1;color:var(--ink-soft)}
.wlab .n{font-size:calc(24px*var(--hs));color:var(--ink)}
.wlab .d{font-size:calc(17px*var(--hs))}
.wday.today .wlab .n,.wday.today .wlab .d{color:var(--blue);font-weight:600}

/* month page */
.mgrid{display:grid;grid-template-columns:repeat(7,1fr);margin:0 0 16px;padding:6px 6px 4px;background:var(--card);border-radius:18px}
.mwd{font:500 10.5px/1 var(--sans);color:var(--ink-soft);text-align:center;padding:3px 0 3px}
.mday{height:33px;display:grid;place-items:center;position:relative;font:400 calc(21px*var(--hs))/1 var(--hand);color:var(--ink)}
.mday.has::after{content:"";position:absolute;bottom:2px;left:50%;width:4px;height:4px;margin-left:-2px;border-radius:50%;background:var(--ink-soft)}
.mday.today span{display:grid;place-items:center;min-width:27px;height:27px;padding:0 4px;border-radius:50%;background:var(--blue);color:var(--paper)}
.mday.today.has::after{background:var(--blue)}
.mlist .label{margin-bottom:2px}
.mrow{display:grid;grid-template-columns:78px minmax(0,1fr);align-items:baseline;width:100%;padding:7px 0;border-top:1px solid var(--rule)}
.mrow .k{font:400 calc(22px*var(--hs))/1.2 var(--hand);color:var(--ink-soft);white-space:nowrap}
.mrow.today .k{color:var(--blue)}
.mrow .v{font:400 calc(22px*var(--hs))/1.3 var(--hand);color:var(--ink);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.mrow .v.alldone{color:var(--ink-soft);text-decoration:line-through}
.empty{font:400 calc(21px*var(--hs))/1.3 var(--hand);color:var(--ink-soft);margin:6px 0}

/* month sections on 6-month and year pages */
.msec{margin:0 0 8px;padding:2px 14px 8px;background:var(--card);border-radius:18px}
.mhead{display:flex;align-items:baseline;gap:8px;font:400 calc(26px*var(--hs))/1.2 var(--hand);color:var(--ink);padding:10px 0 2px}
.mhead i{font-style:normal;font-size:calc(24px*var(--hs));color:var(--ink-faint)}
.msec.now .mhead{color:var(--blue)}
.msec.empty{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:4px;align-items:start;padding:2px 14px 2px}
.msec.empty .mhead{font-size:calc(23px*var(--hs));line-height:32px;padding:0;height:32px}
.msec .lines{background-image:none}
.msec.empty .lines{min-height:0}
.drawer{margin:0 0 8px}
.drawer-btn{display:flex;align-items:center;justify-content:space-between;width:100%;margin:0 0 8px;padding:12px 16px;border-radius:18px;border:1px dashed var(--rule-strong);color:var(--ink-soft);font:500 13.5px/1 var(--sans)}
.drawer-btn svg{width:16px;height:16px;transition:transform .2s}
.drawer.open .drawer-btn svg{transform:rotate(180deg)}

/* floating tab bar */
.tabs{
  position:fixed;left:0;right:0;bottom:0;z-index:20;pointer-events:none;
  padding:0 max(16px,env(safe-area-inset-left,0px)) calc(10px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-right,0px));
}
.tabs-in{
  pointer-events:auto;display:flex;gap:2px;max-width:560px;margin:0 auto;padding:4px;
  background:var(--desk);border:1px solid var(--rule-strong);border-radius:20px;box-shadow:var(--shadow);
}
.tab{flex:1;min-width:0;height:42px;border-radius:16px;text-align:center;font:500 14px/1 var(--sans);color:var(--ink-soft)}
.tab.on{background:var(--sheet);color:var(--blue);font-weight:600;box-shadow:var(--lift)}

/* sheets and toast */
.backdrop{position:fixed;inset:0;z-index:40;background:var(--scrim);-webkit-backdrop-filter:blur(3px);backdrop-filter:blur(3px);display:flex;align-items:flex-end;justify-content:center}
.backdrop.center{align-items:center;padding:16px max(16px,env(safe-area-inset-left,0px))}
.panel{
  width:100%;max-width:560px;max-height:88%;overflow:auto;
  background:var(--sheet);border-radius:24px 24px 0 0;box-shadow:var(--shadow);
  padding:22px max(20px,env(safe-area-inset-left,0px)) calc(14px + env(safe-area-inset-bottom,0px));
  animation:rise .2s ease;
}

function noteBullets(ta,onChange){
  function lineRange(a,b){
    var v=ta.value,ls=v.lastIndexOf('\n',a-1)+1,le=v.indexOf('\n',b);if(le<0)le=v.length;
    return [ls,le];
  }
  ta.addEventListener('input',function(){
    var v=ta.value,c=ta.selectionStart,r=lineRange(c,c),ln=v.slice(r[0],r[1]);
    if(/^[-*] /.test(ln)&&c>=r[0]+2&&c<=r[0]+2+Math.max(0,ln.length-2)){
      ta.value=v.slice(0,r[0])+'• '+v.slice(r[0]+2);ta.setSelectionRange(c,c);
    }
    onChange();
  });
  ta.addEventListener('beforeinput',function(e){
    if(e.inputType!=='insertLineBreak'&&e.inputType!=='insertParagraph')return;
    var a=ta.selectionStart,b=ta.selectionEnd;if(a!==b)return;
    var r=lineRange(a,a),ln=ta.value.slice(r[0],r[1]);
    if(ln.indexOf('• ')!==0)return;
    e.preventDefault();
    if(ln==='• '){ta.setRangeText('',r[0],r[1],'end')}
    else ta.setRangeText('\n• ',a,a,'end');
    onChange();
  });
  return function toggle(){
    var a=ta.selectionStart,b=ta.selectionEnd,r=lineRange(a,b),v=ta.value;
    var lines=v.slice(r[0],r[1]).split('\n');
    var all=lines.every(function(l){return l.indexOf('• ')===0});
    var out=lines.map(function(l){return all?l.slice(2):(l.indexOf('• ')===0?l:'• '+l)}).join('\n');
    ta.setRangeText(out,r[0],r[1],'end');ta.focus();onChange();
  };
}

var SCOPE='https://www.googleapis.com/auth/drive.appdata',FNAME='yarin-defteri.json';

var gTok=null,gTokExp=0,GTK='defter.gt',lastSilent=0,syncBusy=false,syncMsg='',autoTimer=null,lastAuto=0,conf=null;
try{var gc=JSON.parse(localStorage.getItem(GTK)||'null');if(gc&&gc.t&&gc.exp>Date.now()+60000){gTok=gc.t;gTokExp=gc.exp}}catch(e){}

function loadGIS(){
  return new Promise(function(res,rej){
    if(window.google&&google.accounts&&google.accounts.oauth2)return res();
    var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
    sc.onload=function(){res()};sc.onerror=function(){rej(new Error('gis'))};
    document.head.appendChild(sc);
  });
}
function getToken(interactive,silentOk){
  if(gTok&&Date.now()<gTokExp-60000)return Promise.resolve(gTok);
  if(!interactive&&!silentOk)return Promise.reject(new Error('needlogin'));
  return loadGIS().then(function(){return new Promise(function(res,rej){
    var to=setTimeout(function(){rej(new Error('timeout'))},interactive?120000:15000);
    var c=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:SCOPE,
      callback:function(r){clearTimeout(to);
        if(r&&r.access_token){gTok=r.access_token;gTokExp=Date.now()+(r.expires_in||3600)*1000;saveTok();res(gTok)}
        else rej(new Error((r&&r.error)||'auth'))},
      error_callback:function(e){clearTimeout(to);rej(new Error((e&&e.type)||'popup'))}});
    c.requestAccessToken(interactive?{}:{prompt:'none'});
  })});
}
function dFetch(url,opt){

  return fetch(url,opt).then(function(r){

    if(!r.ok)throw new Error('http '+r.status);
    return r;
  });
}

function syncNow(auto,silentOk){
  if(!SYNC_OK||syncBusy)return Promise.resolve();
  if(silentOk&&!(gTok&&Date.now()<gTokExp-60000)){if(Date.now()-lastSilent<600000)silentOk=false;else lastSilent=Date.now()}
  syncBusy=true;syncMsg='';setStatus();
  if(auto)lastAuto=Date.now();
  var seq=editSeq,wasOn=S.syncOn;
  return getToken(!auto,silentOk).then(function(){
    if(!S.syncOn){S.syncOn=true;persist()}
    return findFile();
  }).then(function(id){
    if(!id)return pushNow(null,seq).then(function(){endSync('pushed',auto)});
    return readFile(id).then(function(j){
      var rm=parseRemote(j);
      if(!rm)throw new Error('remote');
      var changed=S.syncRev!==rm.savedAt;
      if(S.syncRev==null){
        if(!S.items.length&&!S.pins.length){applyRemote(rm);return endSync('pulled',auto)}
        if(!rm.items.length&&!(rm.pins&&rm.pins.length))return pushNow(id,seq).then(function(){endSync('pushed',auto)});
        if(sameItems(S.items,rm.items)&&samePins(rm.pins)){S.syncRev=rm.savedAt;S.dirty=false;S.syncLast=Date.now();return endSync('ok',auto)}
        if(auto&&editing())return endSync('skip',auto);
        conf={rm:rm,id:id};endSync('conflict',auto);return openConflict();
      }
      if(changed&&S.dirty){
        if(auto&&editing())return endSync('skip',auto);
        conf={rm:rm,id:id};endSync('conflict',auto);return openConflict();
      }
      if(changed){
        if(auto&&editing())return endSync('skip',auto);
        applyRemote(rm);return endSync('pulled',auto);
      }
      if(S.dirty)return pushNow(id,seq).then(function(){endSync('pushed',auto)});
      S.syncLast=Date.now();endSync('ok',auto);
    });
  }).then(function(){
    if(!wasOn&&S.syncOn&&!conf&&document.getElementById('syncStatus'))openSettings();
  }).catch(function(e){
    syncBusy=false;
    if(!wasOn)S.syncOn=false;
    syncMsg=auto?T.syncNeed:T.syncFail;
    if(!auto)toast(T.syncFail);
    persist();setStatus();
  });
}
function openConflict(){
  if(!conf)return;
  var p=h('div',{class:'panel',role:'dialog','aria-modal':'true'});
  p.appendChild(h('div',{class:'phead'},[h('div',{class:'sheet-title',text:T.conflictTitle}),xBtn()]));
  p.appendChild(h('p',{class:'snote',text:T.conflictText}));
  p.appendChild(h('p',{class:'snote',text:T.onThis+': '+S.items.length+' '+T.lines+' · '+T.onDrive+': '+conf.rm.items.length+' '+T.lines}));
  function run(kind){
    var c=conf;conf=null;closeSheet();
    if(syncBusy)return;
    syncBusy=true;setStatus();var seq=editSeq;
    var job;
    if(kind==='remote'){applyRemote(c.rm);endSync('pulled',false);return}
    if(kind==='merge'){
      var seen={};S.items.forEach(function(i){seen[i.id]=1});
      c.rm.items.forEach(function(i){if(!seen[i.id])S.items.push(i)});
      if(c.rm.pins){var ps={};S.pins.forEach(function(i){ps[i.id]=1});c.rm.pins.forEach(function(i){if(!ps[i.id])S.pins.push(i)})}
      persist();render();
    }
    getToken(true).then(function(){return pushNow(c.id,editSeq)}).then(function(){endSync('pushed',false);toast(T.pushed)})
      .catch(function(){syncBusy=false;S.dirty=true;syncMsg=T.syncFail;persist();setStatus();toast(T.syncFail)});
  }
  p.appendChild(h('div',{class:'sbtns'},[
    h('button',{class:'sbtn',type:'button',text:T.merge,onclick:function(){run('merge')}}),
    h('button',{class:'sbtn',type:'button',text:T.takeRemote,onclick:function(){run('remote')}}),
    h('button',{class:'sbtn',type:'button',text:T.takeLocal,onclick:function(){run('local')}})
  ]));
  showSheet(p,true);
}

/* ---------- settings ---------- */
function backupJson(){return JSON.stringify({app:'defter',v:1,savedAt:new Date().toISOString(),lang:S.lang,font:S.font,zoom:S.zoom,yrev:S.yrev,decadeStart:S.decadeStart,pins:S.pins,items:S.items},null,1)}
function setLang(l){
  S.lang=l;T=TX[l];document.documentElement.lang=l;persist();
  document.getElementById('gear').setAttribute('aria-label',T.settings);document.getElementById('pinBtn').setAttribute('aria-label',T.pins);syncBtnUpdate();buildTabs();render();openSettings();
}
function setFont(f){
  S.font=f;document.documentElement.setAttribute('data-font',f);persist();
  render();openSettings();
}
function setZoom(z){
  S.zoom=z;document.documentElement.style.setProperty('--zm',String(z));persist();
  render();openSettings();
}
function openSettings(){
  var p=h('div',{class:'panel',role:'dialog','aria-modal':'true'});
  p.appendChild(h('div',{class:'phead'},[h('div',{class:'sheet-title sicon',role:'img','aria-label':T.settings,html:SUNICON+'<span class="stxt"><span>YARIN</span><span>DEFTERİ</span></span>'}),xBtn()]));
  if(SYNC_OK){
    p.appendChild(h('div',{class:'slabel',text:T.sync}));
    p.appendChild(h('p',{class:'snote',text:T.syncNote}));
    p.appendChild(h('p',{class:'snote',id:'syncStatus',text:syncStatusText()}));
    var sb=h('div',{class:'sbtns'});
    if(!S.syncOn){
      sb.appendChild(h('button',{class:'sbtn',type:'button',text:T.connect,onclick:function(){syncNow(false)}}));
    }else{
      sb.appendChild(h('button',{class:'sbtn',type:'button',text:T.syncNow,onclick:function(){syncNow(false)}}));
      sb.appendChild(h('button',{class:'sbtn',type:'button',text:T.disconnect,onclick:syncOff}));
    }
    p.appendChild(sb);
  }
  function seg(l,name){return h('button',{type:'button',text:name,'aria-pressed':String(S.lang===l),onclick:function(){if(S.lang!==l)setLang(l)}})}
  p.appendChild(h('div',{class:'srow'},[h('span',{text:T.lang}),h('div',{class:'seg'},[seg('tr','Türkçe'),seg('en','English')])]));
  function segF(f,name){return h('button',{type:'button',text:name,'aria-pressed':String(S.font===f),onclick:function(){if(S.font!==f)setFont(f)}})}
  var fontCell=h('div',{class:'scell'},[h('span',{text:T.font}),h('div',{class:'seg'},[segF('hand',T.fontHand),segF('plain',T.fontPlain)])]);
  var zi=ZOOMS.indexOf(S.zoom);if(zi<0)zi=3;
  var sizeCell=h('div',{class:'scell'},[h('span',{text:T.size}),h('div',{class:'seg'},[
    h('button',{type:'button',text:'A−','aria-label':'−',disabled:zi<=0,onclick:function(){setZoom(ZOOMS[zi-1])}}),
    h('span',{class:'zv',text:Math.round(S.zoom*100)+'%'}),
    h('button',{type:'button',text:'A+','aria-label':'+',disabled:zi>=ZOOMS.length-1,onclick:function(){setZoom(ZOOMS[zi+1])}})
  ])]);
  p.appendChild(h('div',{class:'srow2'},[fontCell,sizeCell]));
  p.appendChild(h('div',{class:'slabel',text:T.backup}));
  p.appendChild(h('p',{class:'snote',text:T.backupNote}));
  if(!storageOK)p.appendChild(h('p',{class:'snote',text:T.noStore}));
  var ta=h('textarea',{class:'paste',id:'restoreText',placeholder:T.pasteHere,spellcheck:'false'});
  var btns=h('div',{class:'sbtns'});
  var standalone=!(window.claude&&window.claude.use);
  if(dl||standalone)btns.appendChild(h('button',{class:'sbtn',type:'button',text:T.saveBackup,onclick:function(){
    var name='yarin-defteri-yedek-'+dkey(today())+'.json';
    if(dl){dl.save({filename:name,data:backupJson()}).then(function(){toast(T.saved)}).catch(function(){});return}
    var url=URL.createObjectURL(new Blob([backupJson()],{type:'application/json'}));
    var a=h('a',{href:url,download:name});document.body.appendChild(a);a.click();a.remove();
    setTimeout(function(){URL.revokeObjectURL(url)},1000);toast(T.saved);
  }}));
  btns.appendChild(h('button',{class:'sbtn',type:'button',text:T.copyBackup,onclick:function(){
    var j=backupJson();
    var fallback=function(){ta.value=j;ta.focus();ta.select()};
    try{navigator.clipboard.writeText(j).then(function(){toast(T.copied)}).catch(fallback)}catch(e){fallback()}
  }}));
  p.appendChild(btns);
  p.appendChild(ta);
  var confirming=false;
  var rb=h('button',{class:'sbtn',type:'button',id:'restoreBtn',text:T.restoreBtn});
  ta.addEventListener('input',function(){confirming=false;rb.textContent=T.restoreBtn});
  rb.addEventListener('click',function(){
    var raw=ta.value.trim();if(!raw)return;
    var items=null,ds=null,pn=null;try{var oo=JSON.parse(raw);items=clean(oo);if(oo&&typeof oo.decadeStart==='number')ds=oo.decadeStart;if(oo&&Array.isArray(oo.pins))pn=cleanPins(oo.pins)}catch(e){}
    if(!items){toast(T.bad);return}
    if(!confirming){confirming=true;rb.textContent=T.confirmRestore;return}
    S.items=items;if(ds)S.decadeStart=ds;if(pn)S.pins=pn;S.dirty=true;editSeq++;persist();closeSheet();render();toast(T.restored);autoPushSoon();
  });
  p.appendChild(h('div',{class:'sbtns'},[rb]));
  p.appendChild(h('div',{class:'slabel',text:T.about}));
  p.appendChild(h('p',{class:'snote',text:T.aboutIntro}));
  p.appendChild(h('div',{class:'slabel',text:T.howTitle}));
  p.appendChild(h('ul',{class:'alist'},T.how.map(function(t){return h('li',{text:t})})));
  p.appendChild(h('p',{class:'snote acredit'},[T.credit[0],h('a',{href:'https://www.instagram.com/kaybid/',target:'_blank',rel:'noopener noreferrer',text:'@kaybid'}),T.credit[1]]));
  showSheet(p,true);
}
document.getElementById('gear').addEventListener('click',openSettings);
document.getElementById('pinBtn').addEventListener('click',openPins);

/* ---------- drag and drop ---------- */
var drag=null,pending=null,holdTimer=null,suppressClick=false,lastDragEnd=0,ghost=null,rafId=0;
var dock=document.getElementById('dock'),dockIn=document.getElementById('dockIn');
var dropline=h('div',{class:'dropline',hidden:true});document.body.appendChild(dropline);
function attachDrag(btn,row){
  btn.addEventListener('contextmenu',function(e){e.preventDefault()});
  btn.addEventListener('click',function(e){if(suppressClick){e.stopImmediatePropagation();e.preventDefault()}});
  btn.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(!row.dataset.id)return;
    pending={btn:btn,row:row,id:row.dataset.id,x:e.clientX,y:e.clientY,mouse:e.pointerType==='mouse'};
    try{btn.setPointerCapture(e.pointerId)}catch(err){}
    clearTimeout(holdTimer);
    if(!pending.mouse)holdTimer=setTimeout(function(){if(pending&&!drag)beginDrag(pending.x,pending.y)},320);
  });
  btn.addEventListener('pointermove',function(e){
    if(drag){drag.x=e.clientX;drag.y=e.clientY;updateDrag();return}
    if(!pending||pending.btn!==btn)return;
    var dx=e.clientX-pending.x,dy=e.clientY-pending.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(pending.mouse){if(dist>6)beginDrag(e.clientX,e.clientY)}
    else if(dist>10){clearTimeout(holdTimer);pending=null}
  });
  btn.addEventListener('pointerup',function(){if(drag)finishDrag(true);else{clearTimeout(holdTimer);pending=null}});
  btn.addEventListener('pointercancel',function(){if(drag)finishDrag(false);else{clearTimeout(holdTimer);pending=null}});
  btn.addEventListener('touchmove',function(e){if(drag&&e.cancelable)e.preventDefault()},{passive:false});
}
function beginDrag(x,y){
  var it=pending?findItem(pending.id):null;
  if(!it){pending=null;return}
  drag={it:it,row:pending.row,btn:pending.btn,x:x,y:y,target:null,overChip:false};
  pending=null;suppressClick=true;
  drag.row.classList.add('dragging');
  ghost=h('div',{class:'ghost',text:it.text});document.body.appendChild(ghost);
  document.body.classList.add('dragging-now');
  dockIn.innerHTML='';
  ['week','month','year','decade'].forEach(function(l){
    var k=keyOf(l,anchor);if(l===it.layer&&k===it.key)return;
    dockIn.appendChild(h('div',{class:'dchip','data-layer':l,'data-key':k,text:T[l]}));
  });
  dock.hidden=false;
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
  updateDrag();rafId=requestAnimationFrame(autoLoop);
}
function updateDrag(){
  if(!drag)return;
  var x=drag.x,y=drag.y;
  ghost.style.transform='translate('+Math.round(x+16)+'px,'+Math.round(y-26)+'px)';
  var el=document.elementFromPoint(x,y);
  var zone=el&&el.closest?el.closest('[data-layer][data-key]'):null;
  var old=document.querySelectorAll('.dz-over,.dchip.over');
  for(var i=0;i<old.length;i++){old[i].classList.remove('dz-over');old[i].classList.remove('over')}
  drag.target=null;drag.overChip=false;dropline.hidden=true;
  if(!zone)return;
  var isChip=zone.classList.contains('dchip');
  drag.overChip=isChip;
  zone.classList.add(isChip?'over':'dz-over');
  var rows=[].slice.call(zone.querySelectorAll('.row:not(.draft):not(.dragging),.qrow:not(.dragging)'));
  var before=null;
  for(var j=0;j<rows.length;j++){var r=rows[j].getBoundingClientRect();if(y<r.top+r.height/2){before=rows[j];break}}
  drag.target={layer:zone.dataset.layer,key:zone.dataset.key,beforeId:before?before.dataset.id:null};
  if(!isChip&&rows.length){
    var ref=before||rows[rows.length-1],rr=ref.getBoundingClientRect(),zr=zone.getBoundingClientRect();
    dropline.style.left=(zr.left+12)+'px';dropline.style.width=Math.max(0,zr.width-24)+'px';
    dropline.style.top=((before?rr.top:rr.bottom)-1)+'px';dropline.hidden=false;
  }
}
function autoLoop(){
  if(!drag)return;
  var y=drag.y,vh=window.innerHeight;
  if(y<90)window.scrollBy(0,-Math.min(18,(90-y)/4+4));
  else if(y>vh-190&&!drag.overChip)window.scrollBy(0,Math.min(18,(y-(vh-190))/4+4));
  updateDrag();
  rafId=requestAnimationFrame(autoLoop);
}
function dropLabel(layer,key){
  if(layer==='day')return shortDate(pd(key));
  if(layer==='month')return T.mo[+key.split('-')[1]-1];
  if(layer==='year')return key;
  return T[layer];
}
function applyDrop(d){
  var it=d.it,t=d.target,changed=(it.layer!==t.layer||it.key!==t.key);
  S.items.splice(S.items.indexOf(it),1);
  it.layer=t.layer;it.key=t.key;
  var idx=t.beforeId?S.items.findIndex(function(x){return x.id===t.beforeId}):-1;
  if(idx<0){
    var last=-1;
    S.items.forEach(function(x,i){if(x.layer===t.layer&&x.key===t.key)last=i});
    idx=last>=0?last+1:S.items.length;
  }
  S.items.splice(idx,0,it);
  queueSave();render();
  if(changed)toast(T.moved+' · '+dropLabel(t.layer,t.key));
}
function finishDrag(commit){
  var d=drag;drag=null;pending=null;clearTimeout(holdTimer);cancelAnimationFrame(rafId);
  lastDragEnd=Date.now();
  if(ghost){ghost.remove();ghost=null}
  dock.hidden=true;dropline.hidden=true;document.body.classList.remove('dragging-now');
  var l=document.querySelectorAll('.dz-over,.dchip.over,.dragging');
  for(var i=0;i<l.length;i++){l[i].classList.remove('dz-over');l[i].classList.remove('over');l[i].classList.remove('dragging')}
  setTimeout(function(){suppressClick=false},80);
  if(commit&&d&&d.target)applyDrop(d);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&drag)finishDrag(false)});

/* ---------- gestures ---------- */
var pageEl=document.getElementById('page'),sx=null,sy=0,st=0;
pageEl.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
},{passive:true});
pageEl.addEventListener('touchend',function(e){
  if(sx==null||drag||Date.now()-lastDragEnd<500){sx=null;return}
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;sx=null;
  if(Math.abs(dx)>90&&Math.abs(dy)<40&&dt<450)shift(dx<0?1:-1);
},{passive:true});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var nowKey=dkey(today());
  if(nowKey!==lastToday){if(dkey(anchor)===lastToday)anchor=today();lastToday=nowKey;render()}
  if(SYNC_OK&&S.syncOn&&Date.now()-lastAuto>30000)syncNow(true,true);
});
if(document.fonts&&document.fonts.ready)document.fonts.ready.then(function(){fitAll();fitTitle()});
window.addEventListener('resize',function(){fitAll();fitTitle()});

document.getElementById('gear').setAttribute('aria-label',T.settings);
document.getElementById('pinBtn').setAttribute('aria-label',T.pins);
buildTabs();render();
syncBtnUpdate();
document.getElementById('syncBtn').addEventListener('click',function(){syncNow(false)});
if(SYNC_OK&&S.syncOn)setTimeout(function(){syncNow(true,true)},600);
})();
