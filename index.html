<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f2ede2" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#1b1c20" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Yarın Defteri">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/svg+xml" href="icon.svg">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<style>
:root{color-scheme:light;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
[hidden]{display:none!important}
img{max-width:100%}
</style>
<title>Yarın Defteri</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;600&family=Inter:wght@400;500;600&family=Jost:wght@400&display=swap">
<style>
/* Layout: one calm notebook page made of soft cards on ruled paper; a floating tab bar sits at the bottom. */
:root{
  --paper:#f2ede2;
  --desk:#e8e2d5;
  --sheet:#f8f4ea;
  --ink:#33373f;
  --ink-soft:#6b6f78;
  --ink-faint:#a9a8a1;
  --blue:#4a6d9f;--nt:var(--blue);
  --sun:#e08a4f;
  --today:#c9692a;--pj:#c9692a;--pj-soft:rgba(201,105,42,.34);--pj-wash:rgba(201,105,42,.12);--pin:#f7e792;--pin-ink:#4a431f;--pin-scroll:rgba(55,48,22,.55);
  --blue-soft:rgba(74,109,159,.28);
  --blue-wash:rgba(74,109,159,.11);
  --card:rgba(74,109,159,.055);
  --float:rgba(140,112,64,.075);
  --danger:#b4534a;
  --card-dim:rgba(60,76,110,.085);
  --chip:rgba(60,70,90,.07);
  --rule:rgba(60,72,100,.12);
  --rule-strong:rgba(60,72,100,.19);
  --scrim:rgba(36,34,30,.30);
  --shadow:0 12px 36px rgba(40,36,28,.16);
  --lift:0 1px 3px rgba(40,36,28,.14);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .35 0 0 0 0 .3 0 0 0 0 .22 0 0 0 .035 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  --hand:'Caveat','Bradley Hand','Segoe Print','Comic Sans MS',cursive;
  --sans:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;
  --fs:1;--zm:1;--hs:calc(var(--fs)*var(--zm));
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]):not([data-mode]){
    --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
    --sun:#f0a468;--today:#f0a468;--pj:#f0a468;--pj-soft:rgba(240,164,104,.36);--pj-wash:rgba(240,164,104,.15);--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
    --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
    --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
    --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
    --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
    color-scheme:dark;
  }
}
:root[data-theme="dark"]:not([data-mode]),:root[data-mode="dark"]{
  --paper:#1b1c20;--desk:#131417;--sheet:#25262b;--ink:#e1ded5;--ink-soft:#a1a2a8;--ink-faint:#64656c;
  --sun:#f0a468;--today:#f0a468;--pj:#f0a468;--pj-soft:rgba(240,164,104,.36);--pj-wash:rgba(240,164,104,.15);--pin:#d8c76c;--pin-ink:#2e2911;--pin-scroll:#3b3d45;--blue:#8fabd6;--blue-soft:rgba(143,171,214,.32);--blue-wash:rgba(143,171,214,.15);
  --card:rgba(143,171,214,.07);--float:rgba(255,255,255,.04);--danger:#e0928a;--card-dim:rgba(143,171,214,.035);--chip:rgba(255,255,255,.07);
  --rule:rgba(255,255,255,.07);--rule-strong:rgba(255,255,255,.14);
  --scrim:rgba(0,0,0,.55);--shadow:0 12px 36px rgba(0,0,0,.5);--lift:0 1px 3px rgba(0,0,0,.4);
  --grain:url("data:image/svg+xml;utf8,%3Csvg xmlns='http://www.w3.org/2000/svg' width='180' height='180'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='.85' numOctaves='2' stitchTiles='stitch'/%3E%3CfeColorMatrix values='0 0 0 0 .9 0 0 0 0 .9 0 0 0 0 .9 0 0 0 .03 0'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)'/%3E%3C/svg%3E");
  color-scheme:dark;
}
:root[data-font="plain"]{--hand:'Inter',system-ui,-apple-system,'Segoe UI',Roboto,sans-serif;--fs:.66}

*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  margin:0;
  background-color:var(--paper);
  background-image:var(--grain);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px 124px;
}
button{font:inherit;color:inherit;background:none;border:0;padding:0;margin:0;cursor:pointer;text-align:inherit;transition:background-color .15s,color .15s,opacity .15s}
button:focus-visible,input:focus-visible,textarea:focus-visible{outline:2px solid var(--blue-soft);outline-offset:2px}
h1{margin:0;font-weight:inherit}
.app{max-width:560px;margin:0 auto}

/* top bar */
.gear{pointer-events:auto;position:relative;flex:none;width:36px;height:40px;border-radius:12px;display:grid;place-items:center;color:var(--ink-soft);background:none;border:0;box-shadow:none}

.gear[hidden]{display:none}
@keyframes spin{to{transform:rotate(360deg)}}
.dhead.pend::after{content:'';display:inline-block;width:7px;height:7px;margin-left:8px;border-radius:50%;background:var(--blue);vertical-align:middle}
.gear.pend::after{content:'';position:absolute;top:6px;right:4px;width:7px;height:7px;border-radius:50%;background:var(--blue)}

.pinbtn svg .pn{fill:var(--pin);stroke:var(--ink-soft)}
.pinwrap.pdk{--pin:#3a3b41;--pin-ink:#ebe5cd;--pin-scroll:rgba(235,229,205,.3)}
.pinwrap.pdk .ptitle{border-bottom-color:rgba(235,229,205,.2)}
.pinwrap.pdk .ppc,.pinwrap.pdk .pmove .mc,.pinwrap.pdk .pmove input[type=date]{background:rgba(235,229,205,.12)}
.pinwrap.pdk .pin .lnk{background:rgba(235,229,205,.1)}
.pinwrap.pdk .pdots button.on i{background:#ebe5cd}
.pinwrap{width:min(100%,380px);max-height:min(88vh,calc(var(--vvh,100vh) - 20px));display:flex;flex-direction:column;gap:10px;animation:rise .22s ease}
.pinbar{display:flex;align-items:center;gap:8px}
.pinpill{white-space:nowrap;background:var(--sheet);color:var(--ink);border-radius:999px;padding:10px 15px;font:600 13px/1 var(--sans);box-shadow:var(--lift)}
.pinbar .sp{flex:1}
.pstack{position:relative;flex:none;height:clamp(250px,calc(var(--vvh,100vh)*.5),400px);margin:4px 0 0;touch-action:pan-y;user-select:none;-webkit-user-select:none}
.pstack textarea{user-select:text;-webkit-user-select:text}
.pin{position:absolute;left:11%;top:6px;width:78%;height:calc(100% - 22px);box-sizing:border-box;display:flex;flex-direction:column;background:var(--pin);color:var(--pin-ink);border-radius:2px;padding:24px 14px 4px;box-shadow:0 14px 20px -10px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.12);transform-origin:50% 100%;transition:transform .3s cubic-bezier(.3,.7,.3,1),opacity .2s,filter .2s}
.pin:not(.front){cursor:pointer;filter:brightness(.95)}
.pin:not(.front)>*{pointer-events:none}
.pin:not(.front) textarea,.pin:not(.front) .pact,.pin:not(.front) .ptitle{opacity:.4}
.ptitle{display:block;flex:none;width:100%;box-sizing:border-box;background:none;border:0;border-bottom:1px solid rgba(0,0,0,.14);outline:0;border-radius:0;padding:0 0 6px;margin:0 0 8px;font:600 calc(22px*var(--hs))/1.2 var(--hand);color:var(--pin-ink)}
.ptitle::placeholder{color:var(--pin-ink);opacity:.38;font-weight:400}
.ptitle:focus{border-bottom-color:rgba(0,0,0,.35)}
.pin.far{opacity:0;pointer-events:none}
.pin::before{content:'';position:absolute;left:0;right:0;top:0;height:16px;background:linear-gradient(rgba(0,0,0,.09),rgba(0,0,0,0))}
.pdots{position:relative;display:flex;justify-content:center;gap:2px;padding:0 0 2px;min-height:22px}
.pdots button{touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.ptip{position:absolute;bottom:30px;transform:translateX(-50%);z-index:60;max-width:240px;padding:7px 11px;border-radius:9px;background:var(--sheet);color:var(--ink);box-shadow:var(--lift);font:600 12.5px/1.2 var(--sans);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;pointer-events:none}
.pstack.swp .pin{cursor:grabbing}
.ppick{position:absolute;left:0;right:0;bottom:0;z-index:5;display:flex;flex-wrap:wrap;align-items:center;gap:6px;padding:10px 12px;background:var(--pin);box-shadow:0 -8px 14px -6px rgba(0,0,0,.25)}
.ppl{flex:1 1 100%;font:600 12px/1.2 var(--sans);color:var(--pin-ink);opacity:.75}
.ppc{padding:7px 11px;border-radius:999px;background:rgba(0,0,0,.1);font:600 12.5px/1 var(--sans);color:var(--pin-ink)}
.ppc.x{padding:7px 9px}.ppc.x svg{width:12px;height:12px;display:block}
.xbtn.on{color:var(--blue)}
.ptrash{flex:1 1 auto;min-height:0;max-height:min(60vh,420px);overflow-y:auto;background:var(--sheet);border-radius:16px;padding:6px 14px 10px;box-shadow:var(--lift)}
.ptrhead{display:flex;align-items:center;gap:12px;padding:10px 0}
.ptrt{font:600 15px/1 var(--sans);color:var(--ink-soft)}
.ptrdng{padding:6px 11px;border-radius:999px;background:var(--chip);font:500 12.5px/1 var(--sans);color:var(--danger)}
.ptrempty{margin:6px 0 10px;font:14px/1.3 var(--sans);color:var(--ink-faint)}
.ptrrow{display:flex;gap:8px;align-items:center;padding:10px 0;border-top:1px solid var(--rule)}
.ptrtx{flex:1 1 auto;min-width:0}
.ptrti{font:600 14px/1.3 var(--sans);color:var(--ink);margin-bottom:2px}
.ptrbd{font:400 calc(18px*var(--hs))/1.25 var(--hand);color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
.ptrbtn{flex:none;padding:8px 11px;border-radius:8px;background:var(--chip);font:600 12.5px/1 var(--sans);color:var(--ink-soft)}
.ptrbtn.ic{padding:8px}.ptrbtn.ic svg{width:16px;height:16px;display:block}
.pdots button{width:22px;height:22px;display:grid;place-items:center;padding:0}
.pdots button i{display:block;width:8px;height:8px;border-radius:50%;background:#fff;opacity:.55}
.pdots button.on i{background:var(--pin);opacity:1;transform:scale(1.4)}
.pin textarea{display:block;flex:1 1 auto;width:100%;min-height:0;background:none;border:0;outline:0;resize:none;overflow-y:auto;padding:0;font:400 calc(24px*var(--hs))/1.28 var(--hand);color:var(--pin-ink)}
.pin textarea::placeholder{color:var(--pin-ink);opacity:.45}
.pin .pact{display:flex;justify-content:space-between;align-items:center;margin-top:2px}
.pin .pact .pi{display:inline-flex;align-items:center;gap:3px;padding:8px 7px;opacity:.78}
.pin .pact .pi svg{display:block;width:19px;height:19px}
.pin .pact .pi svg:first-child:not(:only-child){width:12px;height:12px}
.pin .pact button{font:600 12px/1 var(--sans);color:var(--pin-ink);opacity:.62;padding:10px 6px}
.pin .pact button:hover,.pin .pact button.on{opacity:1}
.pmove{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:2px 0 8px;padding:8px;border-radius:8px;background:rgba(0,0,0,.07)}
.ptasks{background:var(--sheet);border-radius:12px;padding:2px 10px 2px 4px}
.pin .ptasks{margin:0 0 10px;transform:rotate(.8deg)}
.ptasks.ptop{flex:1 1 100%;border-radius:16px;box-shadow:var(--lift);padding:4px 12px 4px 6px}
.ptop.dover{outline:2px dashed var(--blue);outline-offset:2px}
.ptasks .phint{padding:12px 8px;font:13px/1.3 var(--sans);color:var(--ink-soft)}
.ptasks .arow:last-child{border-bottom:0}
.ptasks .arow{padding:8px 0;gap:6px}
.ptasks .at{font:600 14px/1.3 var(--sans)}
.trow .grip{flex:none;width:22px;height:34px;display:grid;place-items:center;color:var(--ink-faint);touch-action:none;cursor:grab}
.trow.tdrag{opacity:.35}
.trow.tb{box-shadow:0 -2px 0 var(--blue)}
.trow.ta{box-shadow:0 2px 0 var(--blue)}
.pin.dover{outline:2px dashed var(--blue);outline-offset:2px}
.pmove .pmsg{flex:1 1 100%;font:600 12px/1.3 var(--sans);color:var(--pin-ink);opacity:.85;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pmove .ml{font:600 12px/1 var(--sans)}
.pmove input[type=date]{flex:1 1 90px;min-width:0;font:14px var(--sans);color:var(--pin-ink);background:rgba(255,255,255,.45);border:0;border-radius:7px;padding:7px 8px}
.pmove .mc{flex:1 1 auto;padding:8px 10px;border-radius:7px;background:rgba(255,255,255,.45);font:600 12px/1 var(--sans);color:var(--pin-ink);text-align:center}

/* period navigation */
.nav{display:grid;grid-template-columns:auto minmax(0,1fr) auto;align-items:start;gap:0;margin:0 0 20px}
.ncenter{display:flex;align-items:flex-start;justify-content:center;min-width:0}
.ncenter .t{flex:1 1 auto;max-width:calc(300px*var(--hs))}
.nslot.r{display:flex;justify-content:flex-end;width:auto;min-width:36px}
.nslot.l{display:flex;justify-content:flex-start;width:auto;min-width:36px}
.pinbtn{width:32px}
.nbp{display:flex;flex-direction:column}
.nbrow{display:flex;align-items:center;gap:6px;margin:0 -2px;padding-bottom:12px}
.nbtabs{flex:1 1 auto;min-width:0;display:flex;flex-wrap:wrap;gap:8px 6px;padding:2px}
.nbt.defc{display:inline-flex;align-items:center;gap:6px;padding:7px 12px}.nbt.defc svg{display:block}.nbt.defc b{font:600 12.5px/1 var(--sans)}
.nbt.defc{background:none;box-shadow:inset 0 0 0 1.5px var(--rule-strong)}
.nbt.defc[aria-pressed="true"]{background:var(--blue-wash);box-shadow:inset 0 0 0 1.5px var(--blue-soft)}
.nbt{flex:none;padding:8px 14px;border-radius:999px;background:var(--chip);font:500 13.5px/1 var(--sans);color:var(--ink-soft);white-space:nowrap}
.nbt[aria-pressed="true"]{background:var(--blue-wash);color:var(--blue);box-shadow:inset 0 0 0 1.5px var(--blue-soft)}
.nbt.plus{padding:8px 14px;font-size:17px;line-height:1}
.nbt.del{color:var(--danger)}
.nbt.over{background:var(--blue-soft);color:var(--blue)}
.nbt.ut{touch-action:manipulation;-webkit-touch-callout:none;user-select:none;-webkit-user-select:none}
.nbt.tdrag{opacity:.45}
.nbt.dl{box-shadow:-3px 0 0 var(--blue)}
.nbt.dr{box-shadow:3px 0 0 var(--blue)}
.naddrow{display:flex;gap:8px;align-items:flex-start}
.naddrow .nadd{flex:1 1 auto;min-width:0;width:auto;padding:9px 14px;min-height:calc(26px*var(--hs) + 18px)}
.ntrash{position:relative;flex:none;width:calc(26px*var(--hs) + 18px);height:calc(26px*var(--hs) + 18px);display:grid;place-items:center;border-radius:14px;background:none;color:var(--ink-faint)}
.ntrash svg{width:20px;height:20px;display:block}
.ntrash[aria-pressed="true"]{color:var(--blue)}
.ntrash.over{background:rgba(214,84,84,.28);color:var(--danger);box-shadow:inset 0 0 0 2px var(--danger)}
body.nbdragging .ntrash{color:var(--ink-soft)}
.ntrhead{flex:1 1 auto;min-width:0;display:flex;align-items:center;gap:12px;min-height:calc(26px*var(--hs) + 18px)}
.ntrt{font:600 15px/1 var(--sans);color:var(--ink-soft)}
.ntrhead .dng{color:var(--danger)}
.nrow.ntr .nclamp{font:400 calc(21px*var(--hs))/1.3 var(--hand);color:var(--ink-soft);display:-webkit-box;-webkit-line-clamp:4;-webkit-box-orient:vertical;overflow:hidden;white-space:pre-wrap;word-break:break-word}
body.nbdragging{user-select:none;-webkit-user-select:none;cursor:grabbing}
body.nbdragging .nbtabs .nbt[data-nbtab]{box-shadow:inset 0 0 0 1.5px var(--blue-soft)}
.nrow.ndrag{opacity:.35}
.nghost{position:fixed;z-index:400;pointer-events:none;max-width:220px;padding:8px 12px;border-radius:10px;background:var(--sheet);box-shadow:var(--lift);font:400 calc(18px*var(--hs))/1.2 var(--hand);color:var(--ink);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transform:rotate(-1.5deg)}
.nbtin{flex:none;width:130px;padding:7px 12px;border-radius:999px;border:1px solid var(--blue);background:var(--sheet);font:500 13.5px/1 var(--sans);color:var(--ink);outline:0}
.nbtin.wide{width:min(260px,70%)}
.ttview .ilk,.view .ilk{color:var(--blue)!important;text-decoration:underline;text-decoration-thickness:1px;text-underline-offset:3px;pointer-events:auto}
.done .view .ilk{color:var(--ink-faint)}
.ilk.tb svg{width:.78em;height:.78em;vertical-align:-1px;margin-right:4px}
.tpk{position:fixed;z-index:400;min-width:180px;max-width:min(300px,calc(100vw - 16px));background:var(--sheet);border:1px solid var(--rule);border-radius:12px;padding:4px;box-shadow:0 8px 24px rgba(0,0,0,.28)}
.tpki{display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:10px 10px;border-radius:8px;font:500 14px/1.2 var(--sans);color:var(--ink)}
.tpki:hover{background:var(--chip)}
.tpki svg{flex:none;width:16px;height:16px;color:var(--blue)}
.nrow.ntbl.tflash{animation:tflash 2.2s ease-out}
@keyframes tflash{0%,55%{box-shadow:0 0 0 2px var(--blue)}100%{box-shadow:0 0 0 2px transparent}}
.lkset{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--ink-faint)}
.lkset svg{width:17px;height:17px;display:block}
.lkform{display:flex;gap:6px;align-items:center;padding:8px 0 2px}
.lkform[hidden]{display:none}
.lkin{flex:1 1 auto;min-width:0;padding:9px 12px;border-radius:999px;border:1px solid var(--blue);background:var(--sheet);font:500 14px/1 var(--sans);color:var(--ink);outline:0}
.lkok,.lkno{flex:none;font:500 13px/1 var(--sans);padding:9px 10px;border-radius:999px}
.lkok{background:var(--blue);color:var(--paper)}
.lkno{color:var(--ink-soft)}
.nrow.ntbl{--tblbg:color-mix(in srgb,var(--ink) 5%,transparent);display:block;padding:0;margin:12px 0;border:1px solid var(--rule);border-radius:14px;background:var(--tblbg);overflow:hidden}
.nrow.ntbl .ntx{flex:none}
.nrow.tcol .tbhead{border-bottom:0}
.nrow.tcol .tbti{cursor:pointer}
.tbfold{flex:none;width:30px;height:30px;display:grid;place-items:center;border-radius:8px;color:var(--ink-faint);margin-left:-8px}
.tbfold svg{width:16px;height:16px;display:block}
.tbhead{display:flex;align-items:center;gap:4px;padding:6px 8px 6px 14px;border-bottom:1px solid var(--rule)}
.tbti{display:block;flex:1 1 auto;min-width:0;width:100%;box-sizing:border-box;border:0;outline:0;background:none;padding:6px 0;font:500 calc(21px*var(--hs))/1.3 var(--hand);color:var(--ink)}
.tbti::placeholder,.tbl input::placeholder{color:var(--ink-faint);font-weight:400}

    about:'Hakkında',
    aboutIntro:'Yarın Defteri, zamanı ve günleri daha iyi algılamak ve yönetebilmek için ortaya çıktı.\nGün, hafta, ay, yıl ve 10 yıllık birbirine bağlı sayfalar, bugünü daha geniş bir zaman bağlamında görmeni sağlar. Her işin bir güne sığması gerekmez; ne zaman yapacağını bilmediğin görevleri uygun zaman aralığına (\u201cbu hafta\u201d, \u201cbu ay\u201d, \u201cbu yıl\u201d) bırakıp vakti gelince bir güne taşıyabilirsin. Böylece işleri tek güne sıkıştırmak yerine zamana yayar, yetişemediklerini ertelersin.\nSürükleme bu işin kalbidir: görevi tutup farklı bir zamana, sayfa sekmesine bırakarak ilgili tarihe taşıyabilir ya da defter ikonuna bırakıp arşivleyebilirsin. Benzer şekilde, Zamansız Notlar\u2019daki notları da sürükleyerek sekmelere veya çöpe taşıyabilirsin.\nBir zamanı olmayan notlar için post-it ve Zamansız Notlar var; fikirler, hatırlanacaklar ve kenara koyduğun işler orada bekler.',
    howTitle:'Nasıl kullanılır',
    helpIntro:'Yarın Defteri, kâğıt defterin boş bıraktığı yerleri tamamlamak için yapıldı: yaz, işaretle, yetişmeyeni yarına bırak. Gün, hafta, ay, yıl ve 10 yıl sayfaları birbirine bağlıdır; hepsinde hem liste hem takvim gibi planlayabilirsin. Tarihi belli olmayan işi \u201cbu hafta\u201d ya da \u201cbu ay içinde\u201d diye yazarsın; kâğıt parçası gibi kullan-at notlar için post-it, kalıcı fikirler için Zamansız Notlar, uzun işler için projeler var.',
    helpTabs:['Yarın Defteri','Post-it','Zamansız Notlar'],
    helpPin:[
      ['Post-it nedir','Üstteki post-it düğmesi hiçbir güne bağlı olmayan, kullan-at bir alandır: telefon numarası, alışveriş listesi, aklına gelen bir cümle. Yazdığın anda kaydedilir. En fazla 10 post-it tutarsın.'],
      ['Başlık ve yazı','Her post-itin üstünde küçük bir <b>Başlık</b> alanı vardır, istersen doldurursun. Altına yazdıkların notun kendisidir; <b>☐</b> ile onay kutulu satırlar ekleyebilirsin. <b>+ Yeni not</b> yeni bir post-it açar. Üstteki <b>ay ikonu</b> post-iti koyu yapar (gece parlamasın diye); uygulama koyu temadayken post-it zaten koyu açılır, <b>güneş ikonu</b> sarıya döndürür.'],
      ['Post-itler arasında gezmek','Post-itler üst üste durur. Parmağınla sağa ya da sola kaydırarak, kenardaki yanına dokunarak ya da alttaki noktalara basarak diğerine geçersin. Bir noktaya <b>uzun basarsan</b> o post-itin başlığı görünür; pasif noktalar soluktur.'],
      ['Güne ya da Zamansız Notlara taşı','Alttaki ikonlar post-iti başka yere taşır. <b>Okla güneşli sayfa ikonu</b> post-iti bütünüyle bugünün sayfasına gönderir: başlık görevin kendisi olur, altına yazdıkların görevin notuna, ☐ ile işaretli satırlar ise notun madde listesine geçer. Başlık boşsa ilk satır görev olur. <b>Okla defter ikonu</b> post-iti Zamansız Notlar’a gönderir; birden fazla sekmen varsa hangisine gideceğini seçersin.'],
      ['Çöp','Çöp ikonu post-iti siler, ama hemen kaybolmaz: üstteki çöp ikonuyla <b>Çöp</b> görünümünü açarsın. Oradan <b>Geri koy</b> ile post-iti geri getirir, satırdaki çöp ikonuyla tamamen kaldırır, <b>Çöpü boşalt</b> ile hepsini silersin (emin olmak için iki kere dokunursun).']
    ],
    helpNb:[
      ['Zamansız Notlar nedir','Alttaki çubukta sağdaki defter ikonu Zamansız Notlar’ı açar. Burası bir görev alanı değil, bir hatırlama alanıdır: günlük gibi, fikir ve not defteri gibi. Hiçbir güne bağlı değildir, sayılmaz, bitmesi gerekmez.'],
      ['Not yazmak','Üstteki kutuya yaz, <b>Enter</b> ile kaydedersin (yeni satır için Shift+Enter). Yazıp kaydetmediysen başka bir yere dokunsan bile yazın kutuda durur; sen kaydedene ya da silene kadar kaybolmaz.'],
      ['Sekmeler','<b>Tümü</b> bütün notları gösterir. Saat ikonlu <b>Arşiv</b> kenara koyduğun görevlerin yeridir. <b>+</b> ile kendi sekmelerini açarsın (en fazla 12); bir sekme seçiliyken altta <b>Adı değiştir</b> ve <b>Sekmeyi sil</b> görünür; sekmeye uzun basıp sürükleyerek sırasını değiştirirsin. Sekme silinince notlar Tümü’nde kalır.'],
      ['Uzun notlar','Notun altındaki üçgen uzun yazıyı 4 satıra kısaltır ya da açar: <b>içi boş üçgen</b> kapalı, <b>dolu üçgen</b> açık demektir. 10 satırdan uzun notlar kapalı gelir.'],
      ['Üç nokta, tarih ve taşımak','Notun altında hangi sekmede olduğu ve yazıldığı tarih görünür (sekme adı yalnızca Tümü’de). Üç noktalı tutamaçtan <b>sürükleyerek</b> notu üstteki sekmelerden birine bırakırsın, taşınmış olur. Sürüklerken tutamacı çöp ikonuna bırakırsan not çöpe gider.'],
      ['Çöp','Yeni not kutusunun sağındaki çöp ikonuna dokununca silinen notlar açılır. Bir notu sekmeye sürükleyerek geri koyarsın, notun yanındaki çöp ikonuyla kalıcı silersin, <b>Çöpü boşalt</b> hepsini siler. Çöpte sayaç yoktur; burası serbest alan.'],
      ['Arşiv: kenara konan görevler','Bir görevi sayfadan tutup alttaki defter simgesine bırakırsan ya da satır menüsündeki <b>saat ikonuna</b> basarsan <b>Arşiv</b> sekmesine gider; alt maddeleri ve notuyla birlikte bekler. Aynı liste Ayarlar\u2019daki <b>Arşiv</b> düğmesinde de açılır. Sayaç yoktur. İstediğinde <b>Geri koy</b> ile bugüne ya da başka bir sayfaya döndürürsün.']

    helpNoSync:'',
    help:[
      ['Yazmak ve işaretlemek','Bir satıra dokun ve yaz, <b>Enter</b> yeni satır açar. Kutucuk satırın üstünü çizer, hiçbir şey silinmez. Notlardaki web adresleri tıklanabilir olur; <b>☐ Görev</b> ile onay kutulu satırlar eklersin.'],
      ['Sayfalar','Gün, hafta, ay, yıl ve 10 yıl sayfaları birbirine bağlıdır; alttaki çubuktan seçer, kaydırarak ilerlersin. Her sayfada <b>Bu hafta içinde</b>, <b>Bu ay içinde</b> gibi alanlar vardır: o döneme ait ama bir güne atanmamış işler buraya yazılır.'],
      ['Gün sayfası','Günün işlerini yazarsın. Üstte haftanın, altta ayın <b>içinde</b> alanı görünür; böylece günün yanında yaklaşan işleri de görürsün. Geçmiş bir günde bitmeyenleri <b>bugüne al</b> ile taşırsın, başlığa dokunup tarih seçersin.'],
      ['Hafta sayfası','Yedi gün alt alta kart olarak durur; kartın başlığına dokunmak o günü açar. En üstteki <b>Bu hafta içinde</b> alanı haftaya ait ama güne atanmamış işlerindir, geçen haftadan kalanlar <b>buraya al</b> ile gelir.'],
      ['Ay sayfası','Takvimde her günün işleri başlık olarak görünür (biten soluk ve üstü çizili, fazlası <b>+2</b> gibi). Bir güne dokununca altta <b>Bu ay</b> bölümünde açılır; ikinci dokunuş ya da <b>Güne git</b> gün sayfasını açar. <b>Genişlet</b> bütün günleri alt alta gösterir. <b>Bu ay içinde</b> işlerini ya da takvimdeki başlıkları tutup başka bir güne bırakırsın.'],
      ['Yıl ve 10 yıl','Uzun ve çok uzun vadeli planlar içindir.'],
      ['Taşımak ve ertelemek','Kutucuğa basılı tut (bilgisayarda sürükle) ve başka bir güne, haftaya, aya ya da yıla bırak. Alttaki sekmelere bırakırsan görev o sayfaya (gün, hafta, ay, yıl, 10 yıl) gider; gün sayfasında üstteki <b>‹ ›</b> oklarına bırakırsan önceki ya da sonraki güne gider; alttaki <b>defter ikonuna</b> bırakırsan Arşiv\u2019e kalkar. Ya da satırı açıp <b>üç nokta</b> menüsünden <b>Yarına</b>, <b>Haftaya</b>, <b>Aya</b> de, tarih seç, tekrar kur ya da bir projeye bağla.'],
      ['Not ve proje','Satırın sağındaki ikon not sayfasını açar. Not ile proje aynı sayfadır: madde listesi ve serbest not alanı. Başlığın önündeki ikonla <b>Not</b> (mavi) ile <b>Proje</b> (turuncu) arasında geçersin, başlığa dokunup adını değiştirirsin. Maddeleri tutup sürükleyerek sıralar, takvim ikonuyla tarih verirsin; tarihli madde o günün sayfasına da düşer. Biten maddeyi <b>Arşivlemek için buraya bırak</b> alanına sürüklersen <b>Arşiv</b> bölümüne gider, ilerlemede sayılmaya devam eder. Bir notu ya da projeyi klasör düğmesiyle başka bir projeye bağlarsan onun alt başlığı olur; üst projede toplanır, satırın ikonunda küçük bir nokta görünür. Bütün projeler üstteki <b>Projeler</b> sekmesindedir.'],
      ['Ayarlar','Ayarlar\u2019dan dili, açık ya da koyu temayı, yazı tipini ve boyutunu seçersin. <b>Yedek</b> defterini dosya olarak kaydeder, kopyalar ya da geri yükler. <b>Arşiv</b> arşivlediğin ve sildiğin satırları geri koyar (silinenler 30 gün durur); Göz ikonu (tema ve tam ekran düğmelerinin yanında) üstü çizili satırları saklar. <b>Senkron</b> ile Google hesabına bağlanıp aynı defteri telefonunda ve bilgisayarında kullanırsın; defter Drive\u2019ında yalnızca bu uygulamanın görebildiği gizli bir alanda durur, değişikliklerin kendiliğinden gider. Gönderilmesi gereken bir değişiklik varsa Ayarlar simgesinde küçük bir mavi nokta belirir; Senkron bölümünden <b>Senkronize et</b> demen yeterli.']

    aboutIntro:'Yarın Defteri (Tomorrow\u2019s Notebook) came about to perceive and manage time and days better.\nThe connected day, week, month, year and 10-year pages let you see today in a wider context of time. Not every task has to fit into a day; tasks you don\u2019t know when to do can wait in a suitable stretch of time (\u201cthis week\u201d, \u201cthis month\u201d, \u201cthis year\u201d) and move to a day when their time comes. That way you spread work across time instead of squeezing it into one day, and you postpone what you couldn\u2019t get to.\nDragging is the heart of it: hold a task and drop it on another time or on a page tab to move it to that date, or drop it on the notebook icon to archive it. In the same way, you can drag notes in Timeless Notes onto tabs or the trash.\nFor notes that have no time attached there are post-its and Timeless Notes; ideas, things to remember and tasks you set aside wait there.',
    howTitle:'How to use',
    helpIntro:'Tomorrow\u2019s Notebook was made to fill the gaps a paper notebook leaves: write, tick things off, and leave what did not fit for tomorrow. The day, week, month, year and 10-year pages are connected, and on all of them you can plan like in a list and a calendar at once. An item with no date can be noted as \u201csometime this week\u201d or \u201cthis month\u201d; there are post-its for throwaway notes, Timeless Notes for ideas you want to keep, and projects for long work.',
    helpTabs:['Notebook','Post-it','Timeless Notes'],
    helpPin:[
      ['What a post-it is','The post-it button at the top opens a throwaway space that is not tied to any day: a phone number, a shopping list, a sentence that just came to mind. It saves as you type. You can keep up to 10 post-its.'],
      ['Title and text','Each post-it has a small <b>Title</b> field at the top, filled in only if you like. What you write below is the note itself; <b>\u2610</b> adds lines with checkboxes. <b>+ New note</b> opens another post-it. The <b>moon icon</b> at the top makes the post-it dark so it does not glare at night; when the app is in dark theme the post-it already opens dark, and the <b>sun icon</b> turns it yellow again.'],
      ['Moving between post-its','Post-its stack on top of each other. Swipe left or right, tap the edge of the next one, or tap the dots at the bottom. <b>Hold a dot</b> to see that post-it\u2019s title; inactive dots are faded.'],
      ['Move to a day or to Timeless Notes','The icons at the bottom move a post-it elsewhere. The <b>arrow with the sunny page</b> sends the whole post-it to today\u2019s page: the title becomes the task, what you wrote below becomes the task\u2019s note, and lines marked with \u2610 become the note\u2019s list items. If the title is empty, the first line becomes the task. The <b>arrow with the notebook</b> sends it to Timeless Notes; if you have several tabs you choose which one.'],
      ['Trash','The trash icon deletes a post-it, but it does not vanish at once: open the <b>Trash</b> view with the trash icon at the top. There <b>Put back</b> restores a post-it, the trash icon on its row removes it for good, and <b>Empty trash</b> clears everything (tap twice to be sure).']
    ],
    helpNb:[
      ['What Timeless Notes is','The notebook icon at the right of the bottom bar opens Timeless Notes. It is not a task area but a place to remember: like a journal or an idea book. It is tied to no day, nothing is counted, nothing has to get done.'],
      ['Writing a note','Type in the box at the top and press <b>Enter</b> to save (Shift+Enter for a new line). If you wrote something and did not save it, it stays in the box even when you tap elsewhere, until you save or delete it.'],
      ['Tabs','<b>All</b> shows every note. <b>Archive</b>, with the clock icon, is where tasks you set aside wait. <b>+</b> makes your own tabs (up to 12); with a tab selected, <b>Rename</b> and <b>Delete tab</b> appear below the notes; long-press a tab and drag it to reorder. When a tab is deleted its notes stay in All.'],
      ['Long notes','The triangle under a note shortens a long text to 4 lines or opens it: a <b>hollow triangle</b> means folded, a <b>filled triangle</b> means open. Notes longer than 10 lines start folded.'],
      ['Three dots, date and moving','Under a note you see its tab and the date it was written (the tab name only in All). <b>Drag</b> the three-dot handle onto one of the tabs above to move the note there, or onto the trash icon to delete it.'],
      ['Trash','Tap the trash icon at the right of the new-note box to open deleted notes. Drag a note onto a tab to put it back, use the trash icon next to a note to delete it forever, or <b>Empty trash</b> to clear all. The trash has no counter; this is a free space.'],
      ['Archive: tasks set aside','Hold a task and drop it on the notebook icon at the bottom, or tap the <b>clock icon</b> in its menu, and it goes to the <b>Archive</b> tab, waiting with its sub-items and note. The same list opens from <b>Archive</b> in Settings. There is no counter. <b>Put back</b> returns it to today or any other page when you want.']
    ],

    help:[
      ['Writing and ticking off','Tap a line and write, <b>Enter</b> opens a new line. The box crosses a line out, nothing is ever deleted. Web addresses in notes become tappable; use <b>☐ Task</b> to add lines with checkboxes.'],
      ['Pages','The day, week, month, year and 10-year pages are connected; pick one from the bar at the bottom or swipe to turn the page. Every page has areas like <b>Sometime this week</b> and <b>Sometime this month</b>: things that belong to that period but not to a day yet.'],
      ['Day page','Write the day\u2019s items here. The week\u2019s and the month\u2019s \u201csometime\u201d areas sit above and below, so you see what is coming next to today. Unfinished items from a past day move over with <b>move unfinished to today</b>, and tapping the title lets you pick a date.'],
      ['Week page','The seven days stand one under another as cards; tapping a card\u2019s title opens that day. The <b>Sometime this week</b> area at the top holds what belongs to the week but not to a day, and leftovers from last week come in with <b>bring here</b>.'],
      ['Month page','Each day shows its items as small titles (done ones are faded and crossed out, extras become <b>+2</b>). Tap a day and it opens in the <b>This month</b> section below; a second tap or <b>Go to day</b> opens the day page. <b>Expand</b> lists every day. Hold a <b>Sometime this month</b> item or a title in the calendar and drop it on another day.'],

      ['Notes and projects','The icon at the right of a line opens its note page. A note and a project are the same page: a list of items plus a free note field. The icon before the title switches between <b>Note</b> (blue) and <b>Project</b> (orange), and tapping the title renames it. Hold an item to drag it into order, and give it a date with the calendar icon; a dated item also shows up on that day. Drag a finished item to <b>Drop here to archive</b> and it moves to the <b>Archive</b> section, still counted in the progress. Attach a note or project to another project with the folder button and it becomes its sub-heading: it is gathered in the parent project, and its icon gets a small dot. All projects are in the <b>Projects</b> tab at the top.'],

/* ---------- dates ---------- */
function pad(n){return String(n).padStart(2,'0')}
function dkey(d){return d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate())}
function pd(s){var p=s.split('-').map(Number);return new Date(p[0],(p[1]||1)-1,p[2]||1)}
function addDays(d,n){return new Date(d.getFullYear(),d.getMonth(),d.getDate()+n)}
function wdIdx(d){return (d.getDay()+6)%7}
function monday(d){return addDays(d,-wdIdx(d))}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}
function keyOf(layer,d){
  if(layer==='day')return dkey(d);
  if(layer==='week')return dkey(monday(d));
  if(layer==='month')return d.getFullYear()+'-'+pad(d.getMonth()+1);
  if(layer==='decade'){var b=S.decadeStart;return String(b+10*Math.floor((d.getFullYear()-b)/10))}
  return String(d.getFullYear());
}
function monthAnchor(y,m){
  var d=new Date(y,m,1),t=today();
  return (d.getFullYear()===t.getFullYear()&&d.getMonth()===t.getMonth())?t:d;
}

/* ---------- navigation ---------- */
function isCur(){return keyOf(view,anchor)===keyOf(view,today())}
function go(layer,date){view=layer;anchor=date;render();window.scrollTo(0,0)}
function shift(dir){
  if(view==='nb')return;
  var y=anchor.getFullYear(),m=anchor.getMonth();
  if(view==='day')anchor=addDays(anchor,dir);
  else if(view==='week')anchor=addDays(anchor,7*dir);
  else if(view==='month')anchor=monthAnchor(y,m+dir);
  else if(view==='decade')anchor=monthAnchor(y+10*dir,0);
  else anchor=monthAnchor(y+dir,0);
  render();window.scrollTo(0,0);slideIn(dir);
}

function loadGIS(){
  return new Promise(function(res,rej){
    if(window.google&&google.accounts&&google.accounts.oauth2)return res();
    var sc=document.createElement('script');sc.src='https://accounts.google.com/gsi/client';sc.async=true;
    sc.onload=function(){res()};sc.onerror=function(){rej(new Error('gis'))};

function getToken(interactive,silentOk){
  if(gTok&&Date.now()<gTokExp-60000)return Promise.resolve(gTok);
  if(!interactive&&!silentOk)return Promise.reject(new Error('needlogin'));
  function tidy(){
    /* Google leaves a hidden frame behind after a silent sign-in; a stuck one keeps the browser tab spinning */
    if(interactive)return;
    var fr=document.querySelectorAll('iframe[src*="accounts.google.com"]');
    for(var i=0;i<fr.length;i++)if(fr[i].parentNode)fr[i].parentNode.removeChild(fr[i]);
  }
  return loadGIS().then(function(){return new Promise(function(res,rej){
    var to=setTimeout(function(){rej(new Error('timeout'))},interactive?120000:15000);
    var c=google.accounts.oauth2.initTokenClient({client_id:GCLIENT,scope:SCOPE,
      callback:function(r){clearTimeout(to);
        if(r&&r.access_token){gTok=r.access_token;gTokExp=Date.now()+(r.expires_in||3600)*1000;saveTok();res(gTok)}
        else rej(new Error((r&&r.error)||'auth'))},
      error_callback:function(e){clearTimeout(to);rej(new Error((e&&e.type)||'popup'))}});

}

/* ---------- drag and drop ---------- */
var drag=null,pending=null,holdTimer=null,suppressClick=false,lastDragEnd=0,ghost=null,rafId=0;
var dock=document.getElementById('dock'),dockIn=document.getElementById('dockIn');
var dropline=h('div',{class:'dropline',hidden:true});document.body.appendChild(dropline);
function attachDrag(btn,row){
  btn.addEventListener('contextmenu',function(e){e.preventDefault()});
  btn.addEventListener('click',function(e){if(suppressClick){e.stopImmediatePropagation();e.preventDefault()}});
  btn.addEventListener('pointerdown',function(e){
    if(e.pointerType==='mouse'&&e.button!==0)return;
    if(!row.dataset.id)return;
    pending={btn:btn,row:row,id:row.dataset.id,x:e.clientX,y:e.clientY,mouse:e.pointerType==='mouse'};
    try{btn.setPointerCapture(e.pointerId)}catch(err){}
    clearTimeout(holdTimer);
    if(!pending.mouse)holdTimer=setTimeout(function(){if(pending&&!drag)beginDrag(pending.x,pending.y)},320);
  });
  btn.addEventListener('pointermove',function(e){
    if(drag){drag.x=e.clientX;drag.y=e.clientY;updateDrag();return}
    if(!pending||pending.btn!==btn)return;
    var dx=e.clientX-pending.x,dy=e.clientY-pending.y,dist=Math.sqrt(dx*dx+dy*dy);
    if(pending.mouse){if(dist>6)beginDrag(e.clientX,e.clientY)}
    else if(dist>10){clearTimeout(holdTimer);pending=null}
  });
  btn.addEventListener('pointerup',function(){if(drag)finishDrag(true);else{clearTimeout(holdTimer);pending=null}});
  btn.addEventListener('pointercancel',function(){if(drag)finishDrag(false);else{clearTimeout(holdTimer);pending=null}});
  btn.addEventListener('touchmove',function(e){if(drag&&e.cancelable)e.preventDefault()},{passive:false});
}
function beginDrag(x,y){
  var it=pending?findItem(pending.id):null;
  if(!it){pending=null;return}
  drag={it:it,row:pending.row,btn:pending.btn,x:x,y:y,target:null,overChip:false};
  pending=null;suppressClick=true;
  drag.row.classList.add('dragging');
  ghost=h('div',{class:'ghost',text:dispText(it.text)});document.body.appendChild(ghost);
  document.body.classList.add('dragging-now');document.body.classList.toggle('arrows-on',view==='day');
  document.body.classList.add('tabs-on');
  try{if(navigator.vibrate)navigator.vibrate(12)}catch(e){}
  updateDrag();rafId=requestAnimationFrame(autoLoop);
}
function updateDrag(){
  if(!drag)return;
  var x=drag.x,y=drag.y;
  ghost.style.transform='translate('+Math.round(x+16)+'px,'+Math.round(y-26)+'px)';
  var el=document.elementFromPoint(x,y);
  var zone=el&&el.closest?el.closest('[data-layer][data-key]'):null;
  var old=document.querySelectorAll('.dz-over,.dchip.over,.arrow.over,.tab.over');
  for(var i=0;i<old.length;i++){old[i].classList.remove('dz-over');old[i].classList.remove('over')}
  drag.target=null;drag.overChip=false;dropline.hidden=true;
  var nt=el&&el.closest?el.closest('.tabnb'):null;
  if(nt){drag.overChip=true;nt.classList.add('over');drag.target={pin:true};return}
  var tb=el&&el.closest?el.closest('.tab[data-layer]'):null;
  if(tb){drag.overChip=true;tb.classList.add('over');drag.target={layer:tb.dataset.layer,key:keyOf(tb.dataset.layer,anchor),beforeId:null};return}
  var ar=view==='day'&&el&&el.closest?el.closest('.arrow'):null;
  if(ar){ar.classList.add('over');drag.target={layer:'day',key:dkey(addDays(anchor,+ar.dataset.dir)),beforeId:null};return}
  if(!zone)return;
  var isChip=zone.classList.contains('dchip');
  drag.overChip=isChip;
  zone.classList.add(isChip?'over':'dz-over');
  var rows=[].slice.call(zone.querySelectorAll('.row:not(.draft):not(.dragging),.qrow:not(.dragging)'));
  var before=null;
  for(var j=0;j<rows.length;j++){var r=rows[j].getBoundingClientRect();if(y<r.top+r.height/2){before=rows[j];break}}
  drag.target={layer:zone.dataset.layer,key:zone.dataset.key,beforeId:before?before.dataset.id:null};
  if(!isChip&&rows.length){
    var ref=before||rows[rows.length-1],rr=ref.getBoundingClientRect(),zr=zone.getBoundingClientRect();
    dropline.style.left=(zr.left+12)+'px';dropline.style.width=Math.max(0,zr.width-24)+'px';
    dropline.style.top=((before?rr.top:rr.bottom)-1)+'px';dropline.hidden=false;
  }
}
function autoLoop(){
  if(!drag)return;
  var y=drag.y,vh=window.innerHeight;
  if(y<90)window.scrollBy(0,-Math.min(18,(90-y)/4+4));
  else if(y>vh-190&&!drag.overChip)window.scrollBy(0,Math.min(18,(y-(vh-190))/4+4));
  updateDrag();
  rafId=requestAnimationFrame(autoLoop);
}
function dropLabel(layer,key){
  if(layer==='day')return shortDate(pd(key));
  if(layer==='month')return T.mo[+key.split('-')[1]-1];
  if(layer==='year')return key;
  return T[layer];
}
function toPin(it){
  if(it.rep||it.pt){toast(T.pinNoRep);return}
  stash(it,'pin');render();
  toast(T.moved+' \u00b7 '+T.nbDef,{label:T.undo,fn:function(){unstash(it);render()}});
}
function applyDrop(d){
  if(d.target.pin){toPin(d.it);return}
  var it=d.it,t=d.target,changed=(it.layer!==t.layer||it.key!==t.key);
  S.items.splice(S.items.indexOf(it),1);
  it.layer=t.layer;it.key=t.key;
  var idx=t.beforeId?S.items.findIndex(function(x){return x.id===t.beforeId}):-1;
  if(idx<0){
    var last=-1;
    S.items.forEach(function(x,i){if(x.layer===t.layer&&x.key===t.key)last=i});
    idx=last>=0?last+1:S.items.length;
  }
  S.items.splice(idx,0,it);
  queueSave();render();
  if(changed)toast(T.moved+' · '+dropLabel(t.layer,t.key));
}
function finishDrag(commit){
  var d=drag;drag=null;pending=null;clearTimeout(holdTimer);cancelAnimationFrame(rafId);
  lastDragEnd=Date.now();
  if(ghost){ghost.remove();ghost=null}
  dock.hidden=true;dropline.hidden=true;document.body.classList.remove('dragging-now');document.body.classList.remove('arrows-on');document.body.classList.remove('tabs-on');
  var l=document.querySelectorAll('.dz-over,.dchip.over,.dragging,.arrow.over,.tab.over');
  for(var i=0;i<l.length;i++){l[i].classList.remove('dz-over');l[i].classList.remove('over');l[i].classList.remove('dragging')}
  setTimeout(function(){suppressClick=false},80);
  if(commit&&d&&d.target)applyDrop(d);
}
document.addEventListener('keydown',function(e){if(e.key==='Escape'&&drag)finishDrag(false)});

/* ---------- gestures ---------- */
var pageEl=document.getElementById('page'),sx=null,sy=0,st=0;
pageEl.addEventListener('touchstart',function(e){
  if(e.touches.length!==1){sx=null;return}
  if(e.target.closest&&e.target.closest('.mcar')){sx=null;return}
  sx=e.touches[0].clientX;sy=e.touches[0].clientY;st=Date.now();
},{passive:true});
var swOn=false;
function swEl(){return document.getElementById('pbody')}
function swReset(anim){
  swOn=false;var el=swEl();if(!el)return;
  el.style.transition=anim?'transform .18s ease-out,opacity .18s':'none';
  el.style.transform='';el.style.opacity='';
  if(anim)setTimeout(function(){el.style.transition=''},220);else el.style.transition='';
}
pageEl.addEventListener('touchmove',function(e){
  if(sx==null||drag||view==='nb'||e.touches.length!==1)return;
  var el=swEl();if(!el)return;
  var t=e.touches[0],dx=t.clientX-sx,dy=t.clientY-sy;
  if(Math.abs(dx)<14||Math.abs(dx)<Math.abs(dy)*1.6){if(swOn)swReset(true);return}
  swOn=true;
  var off=Math.max(-44,Math.min(44,Math.round(dx*.4)));
  el.style.transition='none';
  el.style.transform='translateX('+off+'px)';
  el.style.opacity=String(1-Math.min(.35,Math.abs(off)/130));
},{passive:true});
pageEl.addEventListener('touchcancel',function(){sx=null;if(swOn)swReset(true)},{passive:true});
pageEl.addEventListener('touchend',function(e){
  if(sx==null||drag||Date.now()-lastDragEnd<500){sx=null;if(swOn)swReset(true);return}
  var t=e.changedTouches[0],dx=t.clientX-sx,dy=t.clientY-sy,dt=Date.now()-st;sx=null;
  if(Math.abs(dx)>90&&Math.abs(dy)<40&&dt<450){swReset(false);shift(dx<0?1:-1)}
  else if(swOn)swReset(true);
},{passive:true});
document.addEventListener('visibilitychange',function(){
  if(document.visibilityState!=='visible')return;
  var nowKey=dkey(today());
  if(nowKey!==lastToday){if(dkey(anchor)===lastToday)anchor=today();lastToday=nowKey;render()}
  if(SYNC_OK&&S.syncOn&&Date.now()-lastAuto>30000)syncNow(true,true);
});

if(!S.seeded){

/* klavye açılınca pencereler görünür alanın içinde kalsın */
(function(){
  var vv=window.visualViewport,root=document.documentElement;
  if(!vv)return;
  function upd(){
    if(Math.abs(vv.scale-1)>.02){root.style.removeProperty('--vvh');root.style.removeProperty('--vvt');return}
    root.style.setProperty('--vvh',Math.round(vv.height)+'px');
    root.style.setProperty('--vvt',Math.round(vv.offsetTop)+'px');
    var a=document.activeElement;
    if(a&&sheet&&sheet.contains(a)&&/^(TEXTAREA|INPUT)$/.test(a.tagName))a.scrollIntoView({block:'nearest'});
  }
  vv.addEventListener('resize',upd);vv.addEventListener('scroll',upd);
  sheet.addEventListener('focusin',function(e){
    var t=e.target;if(!/^(TEXTAREA|INPUT)$/.test(t.tagName))return;
    setTimeout(function(){upd();t.scrollIntoView({block:'nearest'})},120);
    setTimeout(function(){t.scrollIntoView({block:'nearest'})},400);
  });
  upd();
})();
</script>
